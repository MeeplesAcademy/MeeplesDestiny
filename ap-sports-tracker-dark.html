// leagues yet, so the header is never clickable and Standings shows a
// placeholder until Austin's schedule/color/logo data is in.
// MLS: two conferences, no divisions — Western listed first since the
// Sounders are Austin's primary team there.
const MLS_STANDINGS = {
  Western: ["Austin FC","Colorado Rapids","FC Dallas","Houston Dynamo FC","LA Galaxy","Los Angeles FC","Minnesota United FC","Portland Timbers","Real Salt Lake","San Diego FC","San Jose Earthquakes","Seattle Sounders FC","Sporting Kansas City","St. Louis City SC","Vancouver Whitecaps FC"],
  Eastern: ["Atlanta United FC","Charlotte FC","Chicago Fire FC","CF Montréal","Columbus Crew","D.C. United","FC Cincinnati","Inter Miami CF","Nashville SC","New England Revolution","New York City FC","New York Red Bulls","Orlando City SC","Philadelphia Union","Toronto FC"]
};
const MLS_DISPLAY_ORDER = ["Western","Eastern"];
const MY_TEAMS_MLS = ["Seattle Sounders FC"];

const ESPN_MLS_STANDINGS_URL = "https://site.api.espn.com/apis/v2/sports/soccer/usa.1/standings?type=0&level=3";
let mlsStandingsFetchState = "idle"; // idle | loading | done | failed
let MLS_LIVE_RECORDS = {}; // team full name -> { w, l, d, pts }

async function fetchMLSStandings(forceRerender){
  mlsStandingsFetchState = "loading";
  try {
    const res = await fetch(ESPN_MLS_STANDINGS_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    let entries = data?.standings?.entries
      || data?.children?.[0]?.standings?.entries
      || (data?.children || []).flatMap(c => (c?.standings?.entries) || (c?.children || []).flatMap(cc => cc?.standings?.entries || []));
    if (!entries || !entries.length) throw new Error("Unexpected response shape from ESPN MLS standings API");

    const allTeamNames = Object.values(MLS_STANDINGS).flat();
    const namesByLength = [...allTeamNames].sort((a, b) => b.length - a.length);

    let matched = 0;
    entries.forEach(entry => {
      const displayName = entry?.team?.displayName || entry?.team?.location || entry?.team?.name;
      if (!displayName) return;
      const teamName = namesByLength.find(n => displayName.includes(n));
      if (!teamName) return;
      const stats = entry.stats || [];
      const w = findStatValue(stats, "wins", "w");
      const l = findStatValue(stats, "losses", "l");
      const d = findStatValue(stats, "ties", "draws", "d", "t");
      const pts = findStatValue(stats, "points", "pts");
      if (w == null || l == null) return;
      MLS_LIVE_RECORDS[teamName] = { w, l, d: d ?? "0", pts: pts ?? "—" };
      matched++;
    });
    if (matched === 0) throw new Error("Fetched MLS standings but couldn't match any team names");
    mlsStandingsFetchState = "done";
  } catch (err){
    mlsStandingsFetchState = "failed";
    console.warn("MLS standings live fetch failed — showing placeholder data instead.", err);
  }
  REFRESH_TIMES.mls = new Date();
  if (forceRerender) renderAll();
}

function mlsStandingsRow(teamName, myList){
  const mine = myList.includes(teamName);
  const rowColor = STANDINGS_ROW_COLORS[teamName];
  const styleAttr = rowColor ? ` style="--rowc:${rowColor}"` : "";
  const shaded = mine || !!rowColor;
  const live = MLS_LIVE_RECORDS[teamName];
  const w = live ? live.w : "—";
  const l = live ? live.l : "—";
  const d = live ? live.d : "—";
  const pts = live ? live.pts : "—";
  return `<tr class="${shaded ? "my-team" : ""}"${styleAttr}>
    <td>${teamName}</td>
    <td>${w}</td><td>${l}</td><td>${d}</td><td>${pts}</td>
  </tr>`;
}

function renderMLSStandings(){
  if (mlsStandingsFetchState === "idle") fetchMLSStandings(true);
  const refreshedText = REFRESH_TIMES.mls ? `Refreshed ${REFRESH_TIMES.mls.toLocaleTimeString()}` : "";
  let html = `<h2 class="section-title" style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
    <span>MLS Standings</span>
    <button class="refresh-btn refresh-btn-lg" onclick="fetchMLSStandings(true)">Refresh</button>
    ${refreshRowHTML(refreshedText, ESPN_MLS_STANDINGS_PAGE_URL, "View on ESPN")}
  </h2>
  <div class="standings-groups">`;
  MLS_DISPLAY_ORDER.forEach(conf => {
    html += `<table class="standings">
      <caption>${conf} Conference</caption>
      <tr><th>Team</th><th>W</th><th>L</th><th>D</th><th>PTS</th></tr>
      ${sortByLiveRecord(MLS_STANDINGS[conf], MLS_LIVE_RECORDS, "pts").map(t => mlsStandingsRow(t, MY_TEAMS_MLS)).join("")}
    </table>`;
  });
  html += `</div>`;
  return html;
}

function dashMlsStandingsTab(){
  return renderMLSStandings();
}

// WHL: chl.ca has no public JSON API of its own, and the Google-AI tip
// about fastRhockey didn't pan out (its current docs only cover NHL/PWHL —
// no whl_standings function exists). Highlightly's Hockey API does cover
// the WHL, but rather than hardcode its numeric leagueId/season (which
// would silently go stale every year the season number rolls over), this
// resolves them once by name via Highlightly's own /leagues search — that
// endpoint exists specifically so callers don't have to guess ids. The
// resolved ids are cached in memory for the rest of the session, so a
// normal visit costs two requests (one lookup + one standings fetch), well
// inside the free tier's 100/day.
//
// One header quirk worth flagging: Highlightly's own troubleshooting docs
// confirm that even direct (non-RapidAPI) API keys are sent under the
// x-rapidapi-key / x-rapidapi-host header names — it's not a RapidAPI
// account, that's just the header naming both paths share. If requests
// start failing with a "missing mandatory headers" or "invalid host"
// error, that pairing is the first thing worth re-checking against
// Highlightly's current docs.
const WHL_STANDINGS = {
  Western: {
    "U.S.": ["Everett Silvertips","Wenatchee Wild","Tri-City Americans","Spokane Chiefs","Seattle Thunderbirds","Portland Winterhawks"],
    "B.C.": ["Penticton Vees","Victoria Royals","Vancouver Giants","Prince George Cougars","Kelowna Rockets","Kamloops Blazers"]
  },
  Eastern: {
    East: ["Prince Albert Raiders","Brandon Wheat Kings","Regina Pats","Saskatoon Blades","Swift Current Broncos","Moose Jaw Warriors"],
    Central: ["Medicine Hat Tigers","Calgary Hitmen","Red Deer Rebels","Edmonton Oil Kings","Lethbridge Hurricanes"]
  }
};
const WHL_DISPLAY_ORDER = [
  ["Western","U.S."],
  ["Western","B.C."],
  ["Eastern","East"],
  ["Eastern","Central"]
];
const MY_TEAMS_WHL = ["Everett Silvertips"];

const HIGHLIGHTLY_API_KEY = "909520bf-3da7-477d-9ad8-aa24bbe174a0";
const HIGHLIGHTLY_HOST = "hockey.highlightly.net";
const HIGHLIGHTLY_BASE = "https://hockey.highlightly.net";
function highlightlyHeaders(){
  return { "x-rapidapi-key": HIGHLIGHTLY_API_KEY, "x-rapidapi-host": HIGHLIGHTLY_HOST };
}

let whlStandingsFetchState = "idle"; // idle | loading | done | failed
let WHL_LIVE_RECORDS = {}; // team full name -> { w, l, otl, pts }
let HIGHLIGHTLY_WHL_LEAGUE_ID = null;
let HIGHLIGHTLY_WHL_SEASON = null;

// Looks up the WHL's Highlightly leagueId and current season by name, once
// per session. Picking the highest season number as "current" is a
// heuristic (the API doesn't flag one explicitly) but a safe one: it's
// exactly the number that needs to roll forward every year anyway.
async function resolveWHLLeagueAndSeason(){
  if (HIGHLIGHTLY_WHL_LEAGUE_ID && HIGHLIGHTLY_WHL_SEASON) return;
  const res = await fetch(`${HIGHLIGHTLY_BASE}/leagues?leagueName=WHL`, { headers: highlightlyHeaders() });
  if (!res.ok) throw new Error("HTTP " + res.status + " looking up the WHL's Highlightly league id");
  const data = await res.json();
  const league = (data.data || []).find(l => (l.name || "").toUpperCase() === "WHL") || (data.data || [])[0];
  if (!league) throw new Error("Highlightly's /leagues search returned no league named WHL");
  const seasons = (league.seasons || []).map(s => s.season).filter(n => typeof n === "number");
  if (!seasons.length) throw new Error("Highlightly's WHL league entry has no seasons listed");
  HIGHLIGHTLY_WHL_LEAGUE_ID = league.id;
  HIGHLIGHTLY_WHL_SEASON = Math.max(...seasons);
}

async function fetchWHLStandings(forceRerender){
  whlStandingsFetchState = "loading";
  try {
    await resolveWHLLeagueAndSeason();
    const url = `${HIGHLIGHTLY_BASE}/standings?leagueId=${HIGHLIGHTLY_WHL_LEAGUE_ID}&season=${HIGHLIGHTLY_WHL_SEASON}`;
    const res = await fetch(url, { headers: highlightlyHeaders() });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    const allTeamNames = Object.values(WHL_STANDINGS).flatMap(conf => Object.values(conf)).flat();
    const namesByLength = [...allTeamNames].sort((a, b) => b.length - a.length);

    let matched = 0;
    (data.groups || []).forEach(group => {
      (group.standings || []).forEach(row => {
        const displayName = row?.team?.name;
        if (!displayName) return;
        const teamName = namesByLength.find(n => displayName.includes(n) || n.includes(displayName));
        if (!teamName) return;
        const w = row.wins;
        const l = row.loses;
        const otl = row.losesOvertime ?? 0;
        if (w == null || l == null) return;
        // Highlightly doesn't return points directly for this sport — this
        // assumes the standard 2/1/0 hockey point system (win / OT-or-SO
        // loss / regulation loss), with OT wins already folded into `wins`.
        const pts = w * 2 + otl;
        WHL_LIVE_RECORDS[teamName] = { w, l, otl, pts };
        matched++;
      });
    });
    if (matched === 0) throw new Error("Fetched Highlightly WHL standings but couldn't match any team names");
    whlStandingsFetchState = "done";
  } catch (err){
    whlStandingsFetchState = "failed";
    console.warn("WHL standings live fetch failed — showing placeholder data instead.", err);
  }
  REFRESH_TIMES.whl = new Date();
  if (forceRerender) renderAll();
}

function whlStandingsRow(teamName, myList){
  const mine = myList.includes(teamName);
  const rowColor = STANDINGS_ROW_COLORS[teamName];
  const styleAttr = rowColor ? ` style="--rowc:${rowColor}"` : "";
  const shaded = mine || !!rowColor;
  const live = WHL_LIVE_RECORDS[teamName];
  const w = live ? live.w : "—";
  const l = live ? live.l : "—";
  const otl = live ? live.otl : "—";
  const pts = live ? live.pts : "—";
  return `<tr class="${shaded ? "my-team" : ""}"${styleAttr}>
    <td>${teamName}</td>
    <td>${w}</td><td>${l}</td><td>${otl}</td><td>${pts}</td>
  </tr>`;
}

function renderWHLStandings(){
  if (whlStandingsFetchState === "idle") fetchWHLStandings(true);
  const refreshedText = REFRESH_TIMES.whl ? `Refreshed ${REFRESH_TIMES.whl.toLocaleTimeString()}` : "";
  const statusNote = whlStandingsFetchState === "failed"
    ? `<p style="font-size:12px; color:var(--text-mute); margin:4px 0 0;">Live fetch didn't come back with usable data — showing placeholders below instead.</p>`
    : "";
  let html = `<h2 class="section-title" style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
    <span>WHL Standings</span>
    <button class="refresh-btn refresh-btn-lg" onclick="fetchWHLStandings(true)">Refresh</button>
    ${refreshRowHTML(refreshedText, WHL_STANDINGS_PAGE_URL, "View on chl.ca")}
  </h2>
  ${statusNote}
  <div class="standings-groups">`;
  WHL_DISPLAY_ORDER.forEach(([conf, div]) => {
    html += `<table class="standings">
      <caption>${conf} — ${div} Division</caption>
      <tr><th>Team</th><th>W</th><th>L</th><th>OTL</th><th>PTS</th></tr>
      ${sortByLiveRecord(WHL_STANDINGS[conf][div], WHL_LIVE_RECORDS, "pts").map(t => whlStandingsRow(t, MY_TEAMS_WHL)).join("")}
    </table>`;
  });
  html += `</div>`;
  return html;
}

function dashWhlStandingsTab(){

}

function dashPendingDataTab(sportKey){

}

function renderOtherSports(){
  let html = `<h2 class="section-title" style="font-size:20px;">Other Sports</h2><div class="dash-columns other-sports">`;
  OTHER_SPORTS_COLUMNS.forEach(sportKey => {
    const sport = TEAMS[sportKey];
    const active = state.dashSportTab[sportKey];
    const activeSportClass = sportKey === state.otherActiveSport ? " active-sport" : "";
    html += `<div class="dash-col${activeSportClass}"><h3 class="dash-col-link" style="cursor:default;">${sport.label}</h3>`;
    html += dashSportTabButtons(sportKey);
    if (active === "standings"){
      html += `<div class="dash-col-standings">`;
      if (sportKey === "mls") html += dashMlsStandingsTab();
      else if (sportKey === "nwsl") html += dashNwslStandingsTab();
      else if (sportKey === "whl") html += dashWhlStandingsTab();
      else html += dashPendingDataTab(sportKey);
      html += `</div>`;
    } else {
      html += `<div class="dash-col-tiles">`;
      html += favoriteTeamCardHTML(sportKey, active, sport.teams[active]);
      html += `</div>`;
    }
    html += `</div>`;
  });
  html += `</div>`;

  return html;
}


function goToTeam(sportKey, teamKey){
  state.primary = sportKey;
  state.secondary = teamKey;
  renderAll();
}

// Mobile-only sticky level 2: one pill per sport in DASHBOARD_COLUMNS order,
// abbreviated to its key (CFB/NFL/NHL/MLB) since the full labels don't fit.
// Empty and hidden outside the Dashboard tab.
// Mobile-only sticky level 2: one pill per sport, abbreviated to its key,
// for whichever of Dashboard/Other Sports is active. Empty and hidden on
// every other tab.
function renderDashSportRow(){
  const el = document.getElementById("dashSportRow");
  const columns = state.primary === "dashboard" ? DASHBOARD_COLUMNS
    : state.primary === "other" ? OTHER_SPORTS_COLUMNS
    : null;
  if (!columns){
    el.className = "dash-sport-row";
    el.innerHTML = "";
    return;
  }
  const activeKey = state.primary === "other" ? "otherActiveSport" : "dashActiveSport";
  el.className = "dash-sport-row shown";
  el.innerHTML = columns.map(sportKey => {
    const active = sportKey === state[activeKey];
    return `<button class="pill${active ? " active" : ""}" onclick="pickDashSport('${sportKey}')">${sportKey.toUpperCase()}</button>`;
  }).join("");
}

// Mobile-only sticky level 3: the active sport's team + Standings pills,
// reusing dashTeamPillsHTML so this and the (mobile-hidden) inline row in
// each column never drift out of sync. Empty and hidden outside
// Dashboard/Other Sports.
function renderDashTeamRow(){
  const el = document.getElementById("dashTeamRow");
  const isTabbedSportsView = state.primary === "dashboard" || state.primary === "other";
  if (!isTabbedSportsView){
    el.className = "dash-team-row";
    el.innerHTML = "";
    return;
  }
  const activeKey = state.primary === "other" ? "otherActiveSport" : "dashActiveSport";
  el.className = "dash-team-row shown";
  el.innerHTML = dashTeamPillsHTML(state[activeKey]);
}

/* =========================================================
   CALENDAR TAB
========================================================= */

function calendarColorFor(sportKey, teamKey){
  if (sportKey === "cfb") return "var(--uw-1)";
  const team = TEAMS[sportKey].teams[teamKey];
  return team.dashColor || team.c1;
}

// Mirrors the actual hex values behind each team's calendar color var, since a
// CSS var reference alone can't be used to compute contrast — this decides
// whether an entry's text should be white or dark against its solid fill.
const TEAM_COLOR_HEX = {
  uw:"#4b2e83", sea:"#69be28", buf:"#00338d", skk:"#68a2b9", sea_m:"#005c5c",
  snd:"#5d9741", evt:"#154734", rgn:"#d0a66b" // all three Other Sports teams now have real colors
};

function relativeLuminance(hex){
  const h = hex.replace("#", "");
  const r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}

function calendarTextColorFor(teamKey){
  const hex = TEAM_COLOR_HEX[teamKey];
  if (!hex) return "#ffffff";
  return relativeLuminance(hex) > 140 ? "#1c1f1c" : "#ffffff";
}

// Splits a stored tv string like "ESPN+ 7:00pm PT" or "TV TBA 1:05pm PT · note"
// into separate network / time parts for the calendar's 3-segment format.
function parseGameTV(tvStr){
  if (!tvStr) return { network:"TBA", time:"" };
  const main = tvStr.split(" · ")[0].trim();
  const timeMatch = main.match(/\d{1,2}:\d{2}\s?(am|pm)\s?PT/i);
  if (timeMatch){
    const time = timeMatch[0];
    // No fallback to "TBA" here: a bare time with nothing else (the WHL
    // schedule, which isn't televised) means there's genuinely no
    // broadcaster to show — that's different from data that explicitly
    // says "TV TBA", which callers should still show as-is.
    const network = main.replace(time, "").trim();
    return { network, time };
  }
  return { network: main || "TBA", time:"" };
}

function collectGamesForDate(dateStr){
  const bySport = {};
  Object.keys(TEAMS).forEach(sportKey => {
    TEAMS[sportKey].order.forEach(teamKey => {
      const g = (SCHEDULES[teamKey] || []).find(x => x.date === dateStr);
      if (g && g.status !== "bye"){
        (bySport[sportKey] ||= []).push({ sportKey, teamKey, game:g });
      }
    });
  });
  let result = [];
  Object.keys(bySport).forEach(sportKey => {
    const entries = bySport[sportKey];
    const primaryKey = TEAMS[sportKey].order[0];
    const hasPrimary = entries.some(e => e.teamKey === primaryKey);
    entries.forEach(e => {
      if (hasPrimary && e.teamKey !== primaryKey){
        const primaryDisplay = DISPLAY_NAME[primaryKey];
        // Same real-world game as the primary team's entry — skip the secondary's line.
        if (e.game.opp.includes(primaryDisplay)) return;
      }
      result.push(e);
    });
  });

  // MNF/TNF showcase games run independent of any tracked team's schedule.
  // If one of our own teams happens to be playing in it, tag that entry
  // instead of adding a second line for the same real-world game.
  const showcase = NFL_SHOWCASE_GAMES.find(g => g.date === dateStr);
  if (showcase){
    const matched = result.find(e => e.sportKey === "nfl" &&
      (showcase.away.includes(DISPLAY_NAME[e.teamKey]) || showcase.home.includes(DISPLAY_NAME[e.teamKey])));
    if (matched) matched.showcaseLabel = showcase.label;
    else result.push({ sportKey:"nfl", teamKey:null, game:null, generic:true, showcaseLabel:showcase.label, away:showcase.away, home:showcase.home });
  }

  // Chronological by actual kickoff time — being the primary team doesn't jump the queue.
  // Generic showcase entries have no game.tv to sort by; keep them at the end.
  result.sort((a, b) => {
    if (a.generic && b.generic) return 0;
    if (a.generic) return 1;
    if (b.generic) return -1;
    return parseTimeMinutes(a.game.tv) - parseTimeMinutes(b.game.tv);
  });
  return result;
}

function showcaseBadgeHTML(label, onColor){
  const src = SHOWCASE_LOGOS[label];
  if (!src) return "";
  return `<img class="showcase-badge${onColor ? " on-color" : ""}" src="${src}" alt="${label}">`;
}

function calendarEntryHTML(entry){
  if (entry.generic){
    return `<div class="cal-entry showcase-entry">
      ${showcaseBadgeHTML(entry.showcaseLabel, false)}
      <div class="cal-entry-matchup">${entry.away} @ ${entry.home}</div>
    </div>`;
  }
  const { sportKey, teamKey, game } = entry;
  const color = calendarColorFor(sportKey, teamKey);
  const textColor = calendarTextColorFor(teamKey);
  const styleAttr = `style="--tc:${color}; --tc-text:${textColor};"`;
  const teamDisp = DISPLAY_NAME[teamKey];
  const oppDisp = MASCOT_MAP[game.opp] || game.opp;
  const badge = entry.showcaseLabel ? showcaseBadgeHTML(entry.showcaseLabel, true) : "";
  const matchupLine = `${badge}<span class="cal-entry-team">${teamDisp}</span> ${game.home ? "vs" : "@"} ${oppDisp}`;

  if (game.status === "final"){
    const win = game.score.team > game.score.opp;
    const record = cumulativeRecordThrough(SCHEDULES[teamKey] || [], game);
    return `<div class="cal-entry" ${styleAttr}>
      <div class="cal-entry-matchup">${matchupLine}</div>
      <div class="cal-entry-meta" style="font-weight:bold;">${game.score.team}-${game.score.opp} (${win ? "W" : "L"})${record ? ` · ${record}` : ""}</div>
    </div>`;
  }
  if (game.date < todayISO()){
    // Past but not yet confirmed final (live fetch missed it or hasn't run) — no point
    // showing a stale kickoff time/network for a game that's already happened.
    return `<div class="cal-entry" ${styleAttr}>
      <div class="cal-entry-matchup">${matchupLine}</div>
    </div>`;
  }
  const { network, time } = parseGameTV(game.tv);
  const metaLine = time ? (network ? `${time} - ${network}` : time) : network;
  return `<div class="cal-entry" ${styleAttr}>
    <div class="cal-entry-matchup">${matchupLine}</div>
    <div class="cal-entry-meta">${metaLine}</div>
  </div>`;
}

function daysInMonth(year, monthIdx){ return new Date(year, monthIdx + 1, 0).getDate(); }
function firstWeekdayOfMonth(year, monthIdx){ return new Date(year, monthIdx, 1).getDay(); }
const WEEKDAY_ABBR = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

// Full season, Sept 2026 – April 2027 — all shown stacked on one scrollable page.
const SEASON_MONTHS = [
  [2026,8],[2026,9],[2026,10],[2026,11],
  [2027,0],[2027,1],[2027,2],[2027,3]
];

// Clamp "today" into the season range: before Sept 2026 -> first month, after April
// 2027 -> last month, otherwise whichever month actually contains today.
function currentSeasonMonthIndex(){
  const [y, m] = todayISO().split("-").map(Number);
  const key = y * 100 + (m - 1);
  let idx = SEASON_MONTHS.findIndex(([sy, sm]) => sy === y && sm === (m - 1));
  if (idx !== -1) return idx;
  const [firstY, firstM] = SEASON_MONTHS[0];
  const [lastY, lastM] = SEASON_MONTHS[SEASON_MONTHS.length - 1];
  if (key < firstY * 100 + firstM) return 0;
  if (key > lastY * 100 + lastM) return SEASON_MONTHS.length - 1;
  return 0;
}

function calNav(delta){
  let idx = SEASON_MONTHS.findIndex(([y, m]) => y === state.calYear && m === state.calMonth);
  if (idx === -1) idx = 0;
  idx = Math.max(0, Math.min(SEASON_MONTHS.length - 1, idx + delta));
  const [y, m] = SEASON_MONTHS[idx];
  state.calYear = y;
  state.calMonth = m;
  const el = document.getElementById(`cal-month-${y}-${m}`);
  if (el) el.scrollIntoView({ behavior:"smooth", block:"start" });
  const label = document.getElementById("calCurrentLabel");
  if (label) label.textContent = new Date(y, m, 1).toLocaleDateString("en-US", { month:"long", year:"numeric" });
}

// Scroll-spy: keep the sticky label in sync with whichever month is actually in
// view, instead of only updating on Prev/Next clicks.
let calendarScrollObserver = null;
function initCalendarScrollSync(){
  if (calendarScrollObserver) calendarScrollObserver.disconnect();
  const sections = document.querySelectorAll(".cal-month-section");
  const label = document.getElementById("calCurrentLabel");
  if (!sections.length || !label) return;
  calendarScrollObserver = new IntersectionObserver((entries) => {
    let best = null;
    entries.forEach(e => {
      if (e.isIntersecting && (!best || e.intersectionRatio > best.intersectionRatio)) best = e;
    });
    if (best){
      const m = best.target.id.match(/cal-month-(\d+)-(\d+)/);
      if (m){
        const y = parseInt(m[1], 10), mo = parseInt(m[2], 10);
        state.calYear = y;
        state.calMonth = mo;
        label.textContent = new Date(y, mo, 1).toLocaleDateString("en-US", { month:"long", year:"numeric" });
      }
    }
  }, { rootMargin:"-120px 0px -60% 0px", threshold:[0, 0.25, 0.5, 0.75, 1] });
  sections.forEach(s => calendarScrollObserver.observe(s));
}

function renderMonthSection(year, month){
  const monthLabel = new Date(year, month, 1).toLocaleDateString("en-US", { month:"long", year:"numeric" });
  const totalDays = daysInMonth(year, month);
  const startWeekday = firstWeekdayOfMonth(year, month);
  const todayStr = todayISO();

  let cells = "";
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= totalDays; d++){
    const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const entries = collectGamesForDate(dateStr);
    const isToday = dateStr === todayStr;
    const weekdayLabel = WEEKDAY_ABBR[(startWeekday + d - 1) % 7];
    cells += `<div class="cal-cell${isToday ? " is-today" : ""}">
      <div class="cal-daynum"><span class="cal-cell-dow">${weekdayLabel}</span>${d}</div>
      ${entries.map(calendarEntryHTML).join("")}
    </div>`;
  }
  const trailing = (7 - ((startWeekday + totalDays) % 7)) % 7;
  for (let i = 0; i < trailing; i++) cells += `<div class="cal-cell empty"></div>`;

  return `
    <div class="cal-month-section" id="cal-month-${year}-${month}">
      <div class="cal-month-heading">${monthLabel}</div>
      <div class="cal-grid">
        <div class="cal-dow cal-dow-header">Sun</div><div class="cal-dow cal-dow-header">Mon</div><div class="cal-dow cal-dow-header">Tue</div>
        <div class="cal-dow cal-dow-header">Wed</div><div class="cal-dow cal-dow-header">Thu</div><div class="cal-dow cal-dow-header">Fri</div><div class="cal-dow cal-dow-header">Sat</div>
        ${cells}
      </div>
    </div>`;
}

function renderCalendar(){
  const initialLabel = new Date(state.calYear, state.calMonth, 1).toLocaleDateString("en-US", { month:"long", year:"numeric" });
  const sections = SEASON_MONTHS.map(([y, m]) => renderMonthSection(y, m)).join("");
  return `
    <h2 class="section-title">Calendar</h2>
    <div class="cal-header">
      <button class="refresh-btn cal-nav-btn" onclick="calNav(-1)">↑ Prev Month</button>
      <div class="cal-month-label" id="calCurrentLabel">${initialLabel}</div>
      <button class="refresh-btn cal-nav-btn" onclick="calNav(1)">Next Month ↓</button>
    </div>
    ${sections}`;
}

function renderContent(){
  const content = document.getElementById("content");
  content.classList.toggle("dashboard-view", state.primary === "dashboard" || state.primary === "other");
  if (state.primary === "dashboard"){
    content.innerHTML = renderDashboard();
    return;
  }
  if (state.primary === "other"){
    content.innerHTML = renderOtherSports();
    return;
  }
  if (state.primary === "calendar"){
    content.innerHTML = renderCalendar();
    initCalendarScrollSync();
    if (state.calendarJumpPending){
      state.calendarJumpPending = false;
      const el = document.getElementById(`cal-month-${state.calYear}-${state.calMonth}`);
      if (el) el.scrollIntoView({ behavior:"auto", block:"start" });
    }
    return;
  }
  if (state.primary === "cfb" && state.secondary === "main"){
    content.innerHTML = renderCFBMain();
    return;
  }
  if (state.primary === "nfl" && state.secondary === "main"){
    content.innerHTML = renderNFLCompare();
    return;
  }
  if (state.primary === "nfl" && state.secondary === "compare"){
    content.innerHTML = renderNFLCompare();
    return;
  }
  if (state.secondary === "standings"){
    if (state.primary === "cfb") content.innerHTML = renderCFBStandings();
    if (state.primary === "nfl") content.innerHTML = renderNFLStandings();
    if (state.primary === "nhl") content.innerHTML = renderNHLStandings();
    if (state.primary === "mlb") content.innerHTML = renderMLBStandings();
    return;
  }
  content.innerHTML = renderTeamSchedule(state.primary, state.secondary);
}

// Measures the ACTUAL rendered height of the primary nav and the mobile
// sport-tab row, rather than assuming a fixed pixel value — a nav label
// that wraps to two lines (e.g. "Other Sports" on a narrow phone, or a
// viewer's larger system font size) changes these heights, and a
// hardcoded guess caused the sticky rows below them to overlap on scroll
// instead of stacking cleanly.
function syncStickyOffsets(){
  const nav1 = document.querySelector("nav.primary");
  if (nav1 && nav1.offsetHeight) document.documentElement.style.setProperty("--nav1-h", nav1.offsetHeight + "px");
  const nav2 = document.getElementById("dashSportRow");
  if (nav2 && nav2.offsetHeight) document.documentElement.style.setProperty("--nav2-h", nav2.offsetHeight + "px");
}

function renderAll(){
  if (!state.dashActiveSport) state.dashActiveSport = DASHBOARD_COLUMNS[0];
  if (!state.otherActiveSport) state.otherActiveSport = OTHER_SPORTS_COLUMNS[0];
  renderPrimaryNav();
  renderSecondaryNav();
  renderDashSportRow();
  renderDashTeamRow();
  renderContent();
  syncStickyOffsets();
}

renderAll();
fetchAllLiveScores();
window.addEventListener("resize", syncStickyOffsets);
</script>
