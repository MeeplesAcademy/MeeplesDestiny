// Local (not UTC) YYYY-MM-DD for "today" — avoids an early-morning ET vs UTC date mismatch.
// Every "today" check in this file — upcoming-game filtering, past-game
// formatting, the calendar's default month, all of it — uses this fixed
// zone (Eastern for this file) rather than the viewer's own browser
// timezone, since every date/time on the page is labeled in that zone.
const CALENDAR_TIMEZONE = "America/New_York";
const ZONE_ABBR = "ET";
function todayISOInZone(timeZone){
  const parts = new Intl.DateTimeFormat("en-US", { timeZone, year:"numeric", month:"2-digit", day:"2-digit" }).formatToParts(new Date());
  const y = parts.find(p => p.type === "year").value;
  const m = parts.find(p => p.type === "month").value;
  const d = parts.find(p => p.type === "day").value;
  return `${y}-${m}-${d}`;
}

// Same conversion as todayISOInZone, but for an arbitrary timestamp (e.g. an
// ESPN event's UTC kickoff time) rather than always "right now" — this is
// what determines a game's real start date in this file's zone, regardless
// of what UTC calendar day it rolls over onto.
function eventDateInZone(isoDateStr, timeZone){
  const parts = new Intl.DateTimeFormat("en-US", { timeZone, year:"numeric", month:"2-digit", day:"2-digit" }).formatToParts(new Date(isoDateStr));
  const y = parts.find(p => p.type === "year").value;
  const m = parts.find(p => p.type === "month").value;
  const d = parts.find(p => p.type === "day").value;
  return `${y}-${m}-${d}`;
}

function todayISO(){
  return todayISOInZone(CALENDAR_TIMEZONE);
}

function nextGames(teamKey, count){
  const today = todayISO();
  const games = (SCHEDULES[teamKey] || []).filter(g => g.status === "scheduled" && g.date >= today);
  return games.slice(0, count);
}

/* =========================================================
   LIVE SCORES — same pattern as standings/rankings: fetch
   ESPN's public team-schedule API, update SCHEDULES in place
   when a game is confirmed final, fail silently otherwise.
   Runs once on load; every view that reads SCHEDULES (game
   cards, Calendar, NFL comparison grid) picks up the update
   automatically on the next render.
========================================================= */
const TEAM_ESPN_META = {
  sea: { sport:"football", league:"nfl", id:"sea" },
  den: { sport:"football", league:"nfl", id:"den" },
  atl: { sport:"football", league:"nfl", id:"atl" },
  car: { sport:"football", league:"nfl", id:"car" },
  uw: { sport:"football", league:"college-football", id:"264" },
  hur: { sport:"hockey", league:"nhl", id:"car" },
  sea_m: { sport:"baseball", league:"mlb", id:"sea" }
};

let liveScoresFetchState = "idle"; // idle | loading | done | failed

// ESPN's score field shows up as either a plain string/number or an
// {value, displayValue} object depending on which endpoint/era — handle both
// rather than assume one, and never trust a value that doesn't parse cleanly.
function extractEspnScore(competitor){
  if (!competitor) return null;
  const raw = (typeof competitor.score === "object" && competitor.score !== null)
    ? (competitor.score.value ?? competitor.score.displayValue)
    : competitor.score;
  if (raw == null) return null;
  const n = parseInt(raw, 10);
  return Number.isFinite(n) ? n : null;
}

// Formats an ESPN event's UTC timestamp into this file's fixed display zone
// (matches the "H:MMam/pm ZONE" convention used throughout the schedules).
function formatEventTime(isoDateStr, timeZone, zoneAbbr){
  const d = new Date(isoDateStr);
  const parts = new Intl.DateTimeFormat("en-US", { timeZone, hour:"numeric", minute:"2-digit", hour12:true }).formatToParts(d);
  const hour = parts.find(p => p.type === "hour").value;
  const minute = parts.find(p => p.type === "minute").value;
  const dayPeriod = parts.find(p => p.type === "dayPeriod").value.toLowerCase();
  return `${hour}:${minute}${dayPeriod} ${zoneAbbr}`;
}

function extractBroadcastName(comp){
  const b = comp.broadcasts?.[0];
  if (b){
    if (b.name) return b.name;
    if (Array.isArray(b.names) && b.names.length) return b.names[0];
    if (b.shortName) return b.shortName;
    if (b.callLetters) return b.callLetters;
  }
  const gb = comp.geoBroadcasts?.[0];
  if (gb) return gb.media?.shortName || gb.media?.name || null;
  return null;
}

// Whether ESPN has actually assigned a broadcast for this game yet. Networks
// and kickoff times are announced together in practice — an empty broadcasts
// array means the game is still genuinely TBD, and ESPN's date field for it
// is not a real kickoff time (often just a placeholder), so it must not be
// trusted for a time update.
function hasRealBroadcastInfo(comp){
  return !!(comp.broadcasts?.length || comp.geoBroadcasts?.length);
}

async function fetchLiveScoresForTeam(teamKey){
  const meta = TEAM_ESPN_META[teamKey];
  const games = SCHEDULES[teamKey];
  if (!meta || !games) return;
  // seasontype=2 asks ESPN for regular season only — preseason exhibition games
  // (common in Sept for NHL/NFL) must never be treated as real results.
  const url = `https://site.api.espn.com/apis/site/v2/sports/${meta.sport}/${meta.league}/teams/${meta.id}/schedule?season=2026&seasontype=2`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status} for ${teamKey}`);
  const data = await res.json();
  const events = data?.events || [];

  // Hard safety net: never trust a fetched date outside the range our own
  // schedule data actually covers. ESPN's live endpoint has been observed
  // returning an entirely different season's games for some leagues/teams
  // (e.g. NHL) regardless of the season parameter requested — this rejects
  // that outright rather than trying to guess why it happened.
  const scheduleDates = games.map(g => g.date).filter(Boolean).sort();
  const minDate = scheduleDates[0];
  const maxDate = scheduleDates[scheduleDates.length - 1];

  events.forEach(ev => {
    const comp = ev.competitions?.[0];
    if (!comp) return;

    // Belt-and-suspenders: even with seasontype=2 requested, only trust an
    // event confirmed as regular season (type 2) when that field is present.
    // A missing field is not treated as a red flag — only an explicit
    // non-regular-season value skips the event.
    const seasonTypeVal = ev.season?.type ?? ev.seasonType?.type ?? ev.seasonType;
    if (seasonTypeVal != null && Number(seasonTypeVal) !== 2) return;

    // ESPN's date is UTC, which can land on the calendar day AFTER a late
    // local kickoff (e.g. an 8pm ET Saturday game is already Sunday in UTC).
    // A game's listed date must always be the day it STARTED, in this file's
    // zone — never a later day just because it ran past midnight there.
    const evDateInZone = ev.date ? eventDateInZone(ev.date, CALENDAR_TIMEZONE) : null;
    if (!evDateInZone || evDateInZone < minDate || evDateInZone > maxDate) return;
    let match = games.find(g => g.date === evDateInZone);

    const teamIdUpper = String(meta.id).toUpperCase();
    const own = comp.competitors?.find(c =>
      String(c.id) === String(meta.id) || (c.team?.abbreviation || "").toUpperCase() === teamIdUpper
    );
    const opp = comp.competitors?.find(c => c !== own);
    const oppName = opp?.team?.displayName || opp?.team?.location || opp?.team?.name;

    // Date-based match failed — most likely a flex-scheduled date/time change.
    // Fall back to matching by opponent identity among games not yet final.
    if (!match && oppName){
      match = games.find(g => g.status !== "final" && (oppName.includes(g.opp) || g.opp.includes(oppName)));
    }
    if (!match || match.status === "final") return;

    // Update home/away.
    if (own?.homeAway) match.home = (own.homeAway === "home");

    // Only touch TV/time/date when ESPN has actually assigned a broadcast —
    // otherwise leave everything as-is rather than risk overwriting a correct
    // manually-entered value (like "BTN"/"CBS") with a guess, or writing in a
    // placeholder kickoff time for a game that's genuinely still TBD.
    if (hasRealBroadcastInfo(comp)){
      if (evDateInZone && match.date !== evDateInZone) match.date = evDateInZone;
      const network = extractBroadcastName(comp);
      const timeStr = ev.date ? formatEventTime(ev.date, CALENDAR_TIMEZONE, ZONE_ABBR) : null;
      // If we can't pull a fresh network name even though broadcast info
      // exists, keep whatever network was already there rather than
      // defaulting to a generic "TV TBA" that could clobber a known value.
      const existingNetwork = parseGameTV(match.tv).network;
      const finalNetwork = network || (existingNetwork && !existingNetwork.toUpperCase().includes("TBA") ? existingNetwork : null);
      if (finalNetwork && timeStr) match.tv = `${finalNetwork} ${timeStr}`;
      else if (timeStr) match.tv = `TV TBA ${timeStr}`;
      else if (finalNetwork) match.tv = finalNetwork;
    }

    // Update score/status if the game is confirmed complete.
    const isFinal = comp.status?.type?.completed || comp.status?.type?.state === "post";
    if (!isFinal) return;
    const ownScore = extractEspnScore(own);
    const oppScore = extractEspnScore(opp);
    // Only commit to "final" once we actually have two real numbers — a
    // half-parsed score is worse than leaving the game as still "scheduled".
    if (ownScore == null || oppScore == null) return;
    match.status = "final";
    match.score = { team: ownScore, opp: oppScore };
  });
}

async function fetchAllLiveScores(){
  liveScoresFetchState = "loading";
  const results = await Promise.allSettled(
    Object.keys(TEAM_ESPN_META).map(k => fetchLiveScoresForTeam(k))
  );
  const anyFailed = results.some(r => r.status === "rejected");
  results.forEach(r => { if (r.status === "rejected") console.warn("Live score fetch failed:", r.reason); });
  liveScoresFetchState = anyFailed ? "failed" : "done";
  renderAll();
}


// Sortable value combining date + parsed kickoff time, so same-day games order correctly too.
function parseTimeMinutes(tvStr){
  const { time } = parseGameTV(tvStr);
  const m = (time || "").match(/(\d{1,2}):(\d{2})\s?(am|pm)/i);
  if (!m) return 24 * 60; // unknown time sorts after known times on the same day
  let hh = parseInt(m[1], 10);
  const mm = parseInt(m[2], 10);
  const ap = m[3].toLowerCase();
  if (ap === "pm" && hh !== 12) hh += 12;
  if (ap === "am" && hh === 12) hh = 0;
  return hh * 60 + mm;
}

function gameSortValue(game){
  const [y, m, d] = game.date.split("-").map(Number);
  return (y * 10000 + m * 100 + d) * 10000 + parseTimeMinutes(game.tv);
}

function teamSortValue(teamKey){
  const games = nextGames(teamKey, 1);
  return games.length ? gameSortValue(games[0]) : Infinity;
}

const DASHBOARD_COLUMNS = ["cfb","nfl","nhl","mlb"]; // left-to-right order

function dashboardCardHTML(sportKey, teamKey, team, game){
  const { time } = parseGameTV(game.tv);
  const oppDisp = MASCOT_MAP[game.opp] || game.opp;
  const logo = LOGOS[teamKey] ? `<img class="tile-logo" src="${LOGOS[teamKey]}" alt="${team.name} logo">` : "";
  const tileColor = team.dashColor || team.c1;
  return `
    <div class="dash-tile ${team.tier}" style="--tc1:${tileColor}" onclick="goToTeam('${sportKey}','${teamKey}')">
      <div class="tile-top">
        ${logo}
        <div>
          <div class="league-tag">${TEAMS[sportKey].label} · ${team.tier}</div>
          <div class="team-name">${team.name}</div>
        </div>
      </div>
      <div class="tile-game-bold">${fmtDate(game.date)} — ${game.home ? "vs" : "@"} ${oppDisp}${time ? ` · ${time}` : ""}</div>
    </div>`;
}

function scheduleRowHTML(game, allGames, bold){
  const oppDisp = MASCOT_MAP[game.opp] || game.opp;
  const oppText = `${game.home ? "vs" : "@"} ${oppDisp}`;
  const dateText = fmtDate(game.date);

  // Two lines only when there's a second line worth showing (a final
  // score + record). An upcoming game has nothing to put there, so it
  // stays one line — date, time, and opponent sharing the full row width
  // naturally instead of fighting a fixed-width score column for space.
  let timeText, resultBlock = "";
  if (game.status === "final"){
    timeText = "Final";
    const win = game.score.team > game.score.opp;
    const resultColor = win ? "#2f7a2f" : "#a33";
    const scoreHtml = `<span style="color:${resultColor}">${game.score.team}-${game.score.opp} (${win ? "W" : "L"})</span>`;
    const recordText = allGames ? cumulativeRecordThrough(allGames, game) : "";
    resultBlock = `<div class="tsc-result">
      <span class="tsc-score">${scoreHtml}</span>
      <span class="tsc-record">${recordText}</span>
    </div>`;
  } else {
    const { time } = parseGameTV(game.tv);
    timeText = time || "TBA";
  }

  const rowClass = bold ? "tile-sched-row bold" : "tile-sched-row";
  return `<div class="${rowClass}">
    <div class="tsc-line1">
      <span class="tsc-date">${dateText}</span>
      <span class="tsc-time">${timeText}</span>
      <span class="tsc-opp">${oppText}</span>
    </div>
    ${resultBlock}
  </div>`;
}

function mostRecentFinalGame(teamKey){
  const games = (SCHEDULES[teamKey] || []).filter(g => g.status === "final");
  return games.length ? games[games.length - 1] : null;
}

// Full season, in order — every completed game shows its score (not bold),
// the very next upcoming game is bolded, everything after that is plain.
function fullScheduleCardBody(teamKey, games){
  const todayStr = todayISO();
  const nextGameRef = games.find(g => g.status === "scheduled" && g.date >= todayStr) || null;
  if (!games.length) return `<div class="tile-sched-row">No games loaded</div>`;
  return games.map(g => {
    if (g.status === "bye"){
      return `<div class="tile-sched-row bye"><span class="tsc-date">${fmtDate(g.date)}</span><span class="tsc-bye">Bye Week</span></div>`;
    }
    return scheduleRowHTML(g, games, g === nextGameRef);
  }).join("");
}

// NHL primary team: last 5 completed + next 5 upcoming, immediate next game bolded.
function nhlWindowCardBody(teamKey, games){
  const finalGames = games.filter(g => g.status === "final");
  const upcoming = games.filter(g => g.status === "scheduled");
  const last5 = finalGames.slice(-5);
  const next5 = upcoming.slice(0, 5);
  const nextGameRef = next5[0] || null;
  if (!last5.length && !next5.length) return `<div class="tile-sched-row">No games loaded</div>`;
  let html = "";
  last5.forEach(g => { html += scheduleRowHTML(g, games, false); });
  next5.forEach(g => { html += scheduleRowHTML(g, games, g === nextGameRef); });
  return html;
}

// Secondary team, any sport: most recent result (not bold, matches how primary
// teams treat completed games) and the next game (bolded).
function secondaryCardBody(teamKey, games){
  const mostRecent = mostRecentFinalGame(teamKey);
  const next = nextGames(teamKey, 1)[0];
  let html = "";
  if (mostRecent) html += scheduleRowHTML(mostRecent, games, false);
  if (next) html += scheduleRowHTML(next, games, true);
  if (!mostRecent && !next) html += `<div class="tile-sched-row">No games loaded</div>`;
  return html;
}

function favoriteTeamCardHTML(sportKey, teamKey, team){
  const games = SCHEDULES[teamKey] || [];
  const logo = LOGOS[teamKey] ? `<img class="tile-logo" src="${LOGOS[teamKey]}" alt="${team.name} logo">` : "";
  const tileColor = team.dashColor || team.c1;
  const recent = mostRecentFinalGame(teamKey);
  const recordLabel = recent ? cumulativeRecordThrough(games, recent) : "";

  // NHL keeps the condensed 5-back/5-ahead window (its schedule is far
  // longer); every other sport shows the full season for every team,
  // primary or secondary — there's no more stacked "everyone at once" view,
  // so there's no reason to keep a condensed treatment for secondaries.
  const body = sportKey === "nhl" ? nhlWindowCardBody(teamKey, games) : fullScheduleCardBody(teamKey, games);

  // CFB/NFL no longer have their own standalone pages — the Dashboard pill
  // *is* the destination now. NHL and MLB still have their own pages (their
  // schedules are much longer), so clicking through still makes sense there.
  const hasOwnPage = sportKey === "nhl" || sportKey === "mlb";
  const headerClick = hasOwnPage ? ` onclick="goToTeam('${sportKey}','${teamKey}')"` : "";
  const headerStyle = hasOwnPage ? "" : ` style="cursor:default;"`;

  return `
    <div class="dash-tile-full" style="--tc1:${tileColor}">
      <div class="tile-top"${headerClick}${headerStyle}>
        ${logo}
        <div class="team-name">${team.name}</div>
        ${recordLabel ? `<div class="tile-record">${recordLabel}</div>` : ""}
      </div>
      <div class="tile-full-schedule">
        ${body}
      </div>
    </div>`;
}

// Most recent Sunday (today, if today is Sunday) through the following Sunday — 8 days inclusive.
function thisWeekRange(){
  const todayStr = todayISO();
  const [y, m, d] = todayStr.split("-").map(Number);
  const today = new Date(Date.UTC(y, m - 1, d));
  const dow = today.getUTCDay(); // 0 = Sunday
  const sunday = new Date(today);
  sunday.setUTCDate(today.getUTCDate() - dow);
  const days = [];
  for (let i = 0; i <= 7; i++){
    const dd = new Date(sunday);
    dd.setUTCDate(sunday.getUTCDate() + i);
    days.push(dd.toISOString().slice(0, 10));
  }
  return days;
}

function renderThisWeekSection(){
  const days = thisWeekRange();
  const todayStr = todayISO();
  const cells = days.map(dateStr => {
    const [y, m, d] = dateStr.split("-").map(Number);
    const dUTC = new Date(Date.UTC(y, m - 1, d));
    const dowLabel = dUTC.toLocaleDateString("en-US", { weekday:"short", timeZone:"UTC" });
    const entries = collectGamesForDate(dateStr);
    const isToday = dateStr === todayStr;
    return `<div class="cal-cell week-cell${isToday ? " is-today" : ""}">
      <div class="cal-dow" style="padding:0 0 4px;">${dowLabel}</div>
      <div class="cal-daynum">${d}</div>
      ${entries.map(calendarEntryHTML).join("")}
    </div>`;
  }).join("");

  return `
    <h2 class="section-title" style="font-size:20px; display:flex; align-items:center; gap:10px;">This Week
      <button class="refresh-btn refresh-btn-lg" style="margin-left:auto;" onclick="toggleWeekCollapse()">${state.weekCollapsed ? "Show" : "Hide"}</button>
    </h2>
    <div class="week-grid${state.weekCollapsed ? " collapsed" : ""}">${cells}</div>`;
}

function toggleWeekCollapse(){
  state.weekCollapsed = !state.weekCollapsed;
  renderAll();
}

function switchDashSportTab(sportKey, which){
  state.dashSportTab[sportKey] = which;
  renderAll();
}

// Just the pills (teams + Standings) with no wrapper — shared by each
// column's own inline row (desktop) and the sticky mobile team-row, so
// there's a single source of truth for this markup.
function dashTeamPillsHTML(sportKey){
  const active = state.dashSportTab[sportKey];
  const teamPills = TEAMS[sportKey].order.map(teamKey => {
    const color = calendarColorFor(sportKey, teamKey);
    const textColor = calendarTextColorFor(teamKey);
    const isActive = active === teamKey;
    const pillStyle = isActive
      ? `background:${color}; color:${textColor}; border-color:${color};`
      : `background:var(--panel); color:${color}; border-color:${color};`;
    return `<button class="poll-tab-btn" style="${pillStyle}" onclick="switchDashSportTab('${sportKey}','${teamKey}')">${DISPLAY_NAME[teamKey]}</button>`;
  }).join("");
  return `${teamPills}<button class="poll-tab-btn ${active === "standings" ? "active" : ""}" onclick="switchDashSportTab('${sportKey}','standings')">Standings</button>`;
}

// One pill per team (primary + secondary), colored with that team's actual
// calendar color — solid fill + computed contrast text when active, colored
// outline when not — plus a neutral Standings pill, wrapped for each
// column's own inline row. On mobile this inline copy is hidden via
// .dash-col-team-pills — the sticky dash-team-row shows the same pills.
function dashSportTabButtons(sportKey){
  return `<div class="poll-tab-group dash-col-team-pills" style="margin:8px 0 12px; flex-wrap:wrap;">
    ${dashTeamPillsHTML(sportKey)}
  </div>`;
}

// Mobile-only: switching the sport tab resets that sport back to its
// primary team rather than remembering the last-viewed team.
function pickDashSport(sportKey){
  state.dashActiveSport = sportKey;
  state.dashSportTab[sportKey] = TEAMS[sportKey].order[0];
  renderAll();
}

function dashStandingsLink(sportKey, label){
  return `<div class="dash-standings-link" onclick="goToSport('${sportKey}'); state.secondary='standings'; renderAll();">${label} →</div>`;
}

// CFB: the full AP/CFP/Big Ten picture, stacked (not tabbed) so nothing is
// hidden — same compact tables already built for the CFB Main page's widget.
function dashCfbStandingsTab(){
  if (bigTenFetchState === "idle") fetchBigTenStandings(true);
  if (apPollFetchState === "idle") fetchApPoll(true);
  return cfbMainPollColumn();
}

// NFL: every division, reusing the exact same full-page render — CFB/NFL no
// longer have standalone pages, so this Dashboard tab needs to be complete
// on its own, not just the divisions Matthew's own teams happen to play in.
function dashNflStandingsTab(){
  return renderNFLStandings();
}

// NHL: every division, plus a link out — NHL still has its own standalone
// page (its schedule is much longer).
function dashNhlStandingsTab(){
  return renderNHLStandings() + dashStandingsLink("nhl", "Full NHL Standings (team schedule)");
}

// MLB: every division too, plus a link out — MLB also keeps its own page
// for the same reason (162 games is even longer than NHL's 84).
function dashMlbStandingsTab(){
  return renderMLBStandings() + dashStandingsLink("mlb", "Full MLB Standings (team schedule)");
}

function renderDashboard(){
  let html = renderThisWeekSection();

  html += `<h2 class="section-title" style="font-size:20px; margin-top:24px;">Favorite Teams</h2><div class="dash-columns">`;
  DASHBOARD_COLUMNS.forEach(sportKey => {
    const sport = TEAMS[sportKey];
    const active = state.dashSportTab[sportKey];
    const hasOwnPage = sportKey === "nhl" || sportKey === "mlb";
    const headerClick = hasOwnPage ? ` onclick="goToSport('${sportKey}')"` : ` style="cursor:default;"`;
    const activeSportClass = sportKey === state.dashActiveSport ? " active-sport" : "";
    html += `<div class="dash-col${activeSportClass}"><h3 class="dash-col-link"${headerClick}>${sport.label}</h3>`;
    html += dashSportTabButtons(sportKey);
    if (active === "standings"){
      html += `<div class="dash-col-standings">`;
      if (sportKey === "cfb") html += dashCfbStandingsTab();
      else if (sportKey === "nfl") html += dashNflStandingsTab();
      else if (sportKey === "nhl") html += dashNhlStandingsTab();
      else if (sportKey === "mlb") html += dashMlbStandingsTab();
      html += `</div>`;
    } else {
      html += `<div class="dash-col-tiles">`;
      html += favoriteTeamCardHTML(sportKey, active, sport.teams[active]);
      html += `</div>`;
    }
    html += `</div>`;
  });
  html += `</div>`;

  return html;
}


function goToTeam(sportKey, teamKey){
  state.primary = sportKey;
  state.secondary = teamKey;
  renderAll();
}

// Mobile-only sticky level 2: one pill per sport in DASHBOARD_COLUMNS order,
// abbreviated to its key (CFB/NFL/NHL/MLB) since the full labels don't fit.
// Empty and hidden outside the Dashboard tab.
function renderDashSportRow(){
  const el = document.getElementById("dashSportRow");
  if (state.primary !== "dashboard"){
    el.className = "dash-sport-row";
    el.innerHTML = "";
    return;
  }
  el.className = "dash-sport-row shown";
  el.innerHTML = DASHBOARD_COLUMNS.map(sportKey => {
    const active = sportKey === state.dashActiveSport;
    return `<button class="pill${active ? " active" : ""}" onclick="pickDashSport('${sportKey}')">${sportKey.toUpperCase()}</button>`;
  }).join("");
}

// Mobile-only sticky level 3: the active sport's team + Standings pills,
// reusing dashTeamPillsHTML so this and the (mobile-hidden) inline row in
// each column never drift out of sync. Empty and hidden outside Dashboard.
function renderDashTeamRow(){
  const el = document.getElementById("dashTeamRow");
  if (state.primary !== "dashboard"){
    el.className = "dash-team-row";
    el.innerHTML = "";
    return;
  }
  el.className = "dash-team-row shown";
  el.innerHTML = dashTeamPillsHTML(state.dashActiveSport);
}

/* =========================================================
   CALENDAR TAB
========================================================= */

function calendarColorFor(sportKey, teamKey){
  if (sportKey === "cfb") return "var(--uw-1)";
  const team = TEAMS[sportKey].teams[teamKey];
  return team.dashColor || team.c1;
}

// Mirrors the actual hex values behind each team's calendar color var, since a
// CSS var reference alone can't be used to compute contrast — this decides
// whether an entry's text should be white or dark against its solid fill.
const TEAM_COLOR_HEX = {
  uw:"#4b2e83", den:"#fb4f14", sea:"#69be28", atl:"#a71930",
  car:"#0085ca", hur:"#ce1126", sea_m:"#005c5c"
};

function relativeLuminance(hex){
  const h = hex.replace("#", "");
  const r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}

function calendarTextColorFor(teamKey){
  const hex = TEAM_COLOR_HEX[teamKey];
  if (!hex) return "#ffffff";
  return relativeLuminance(hex) > 140 ? "#1c1f1c" : "#ffffff";
}

// Splits a stored tv string like "ESPN+ 7:00pm ET" or "TV TBA 1:05pm ET · note"
// into separate network / time parts for the calendar's 3-segment format.
function parseGameTV(tvStr){
  if (!tvStr) return { network:"TBA", time:"" };
  const main = tvStr.split(" · ")[0].trim();
  const timeMatch = main.match(/\d{1,2}:\d{2}\s?(am|pm)\s?ET/i);
  if (timeMatch){
    const time = timeMatch[0];
    const network = main.replace(time, "").trim() || "TBA";
    return { network, time };
  }
  return { network: main || "TBA", time:"" };
}

function collectGamesForDate(dateStr){
  const bySport = {};
  Object.keys(TEAMS).forEach(sportKey => {
    TEAMS[sportKey].order.forEach(teamKey => {
      const g = (SCHEDULES[teamKey] || []).find(x => x.date === dateStr);
      if (g && g.status !== "bye"){
        (bySport[sportKey] ||= []).push({ sportKey, teamKey, game:g });
      }
    });
  });
  let result = [];
  Object.keys(bySport).forEach(sportKey => {
    const entries = bySport[sportKey];
    const primaryKey = TEAMS[sportKey].order[0];
    const hasPrimary = entries.some(e => e.teamKey === primaryKey);
    entries.forEach(e => {
      if (hasPrimary && e.teamKey !== primaryKey){
        const primaryDisplay = DISPLAY_NAME[primaryKey];
        // Same real-world game as the primary team's entry — skip the secondary's line.
        if (e.game.opp.includes(primaryDisplay)) return;
      }
      result.push(e);
    });
  });

  // MNF/TNF showcase games run independent of any tracked team's schedule.
  // If one of our own teams happens to be playing in it, tag that entry
  // instead of adding a second line for the same real-world game.
  const showcase = NFL_SHOWCASE_GAMES.find(g => g.date === dateStr);
  if (showcase){
    const matched = result.find(e => e.sportKey === "nfl" &&
      (showcase.away.includes(DISPLAY_NAME[e.teamKey]) || showcase.home.includes(DISPLAY_NAME[e.teamKey])));
    if (matched) matched.showcaseLabel = showcase.label;
    else result.push({ sportKey:"nfl", teamKey:null, game:null, generic:true, showcaseLabel:showcase.label, away:showcase.away, home:showcase.home });
  }

  // Chronological by actual kickoff time — being the primary team doesn't jump the queue.
  // Generic showcase entries have no game.tv to sort by; keep them at the end.
  result.sort((a, b) => {
    if (a.generic && b.generic) return 0;
    if (a.generic) return 1;
    if (b.generic) return -1;
    return parseTimeMinutes(a.game.tv) - parseTimeMinutes(b.game.tv);
  });
  return result;
}

function showcaseBadgeHTML(label, onColor){
  const src = SHOWCASE_LOGOS[label];
  if (!src) return "";
  return `<img class="showcase-badge${onColor ? " on-color" : ""}" src="${src}" alt="${label}">`;
}

function calendarEntryHTML(entry){
  if (entry.generic){
    return `<div class="cal-entry showcase-entry">
      ${showcaseBadgeHTML(entry.showcaseLabel, false)}
      <div class="cal-entry-matchup">${entry.away} @ ${entry.home}</div>
    </div>`;
  }
  const { sportKey, teamKey, game } = entry;
  const color = calendarColorFor(sportKey, teamKey);
  const textColor = calendarTextColorFor(teamKey);
  const styleAttr = `style="--tc:${color}; --tc-text:${textColor};"`;
  const teamDisp = DISPLAY_NAME[teamKey];
  const oppDisp = MASCOT_MAP[game.opp] || game.opp;
  const badge = entry.showcaseLabel ? showcaseBadgeHTML(entry.showcaseLabel, true) : "";
  const matchupLine = `${badge}<span class="cal-entry-team">${teamDisp}</span> ${game.home ? "vs" : "@"} ${oppDisp}`;

  if (game.status === "final"){
    const win = game.score.team > game.score.opp;
    const record = cumulativeRecordThrough(SCHEDULES[teamKey] || [], game);
    return `<div class="cal-entry" ${styleAttr}>
      <div class="cal-entry-matchup">${matchupLine}</div>
      <div class="cal-entry-meta" style="font-weight:bold;">${game.score.team}-${game.score.opp} (${win ? "W" : "L"})${record ? ` · ${record}` : ""}</div>
    </div>`;
  }
  if (game.date < todayISO()){
    // Past but not yet confirmed final (live fetch missed it or hasn't run) — no point
    // showing a stale kickoff time/network for a game that's already happened.
    return `<div class="cal-entry" ${styleAttr}>
      <div class="cal-entry-matchup">${matchupLine}</div>
    </div>`;
  }
  const { network, time } = parseGameTV(game.tv);
  const metaLine = time ? `${time} - ${network}` : network;
  return `<div class="cal-entry" ${styleAttr}>
    <div class="cal-entry-matchup">${matchupLine}</div>
    <div class="cal-entry-meta">${metaLine}</div>
  </div>`;
}

function daysInMonth(year, monthIdx){ return new Date(year, monthIdx + 1, 0).getDate(); }
function firstWeekdayOfMonth(year, monthIdx){ return new Date(year, monthIdx, 1).getDay(); }
const WEEKDAY_ABBR = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

// Full season, Sept 2026 – April 2027 — all shown stacked on one scrollable page.
const SEASON_MONTHS = [
  [2026,8],[2026,9],[2026,10],[2026,11],
  [2027,0],[2027,1],[2027,2],[2027,3]
];

// Clamp "today" into the season range: before Sept 2026 -> first month, after April
// 2027 -> last month, otherwise whichever month actually contains today.
function currentSeasonMonthIndex(){
  const [y, m] = todayISO().split("-").map(Number);
  const key = y * 100 + (m - 1);
  let idx = SEASON_MONTHS.findIndex(([sy, sm]) => sy === y && sm === (m - 1));
  if (idx !== -1) return idx;
  const [firstY, firstM] = SEASON_MONTHS[0];
  const [lastY, lastM] = SEASON_MONTHS[SEASON_MONTHS.length - 1];
  if (key < firstY * 100 + firstM) return 0;
  if (key > lastY * 100 + lastM) return SEASON_MONTHS.length - 1;
  return 0;
}

function calNav(delta){
  let idx = SEASON_MONTHS.findIndex(([y, m]) => y === state.calYear && m === state.calMonth);
  if (idx === -1) idx = 0;
  idx = Math.max(0, Math.min(SEASON_MONTHS.length - 1, idx + delta));
  const [y, m] = SEASON_MONTHS[idx];
  state.calYear = y;
  state.calMonth = m;
  const el = document.getElementById(`cal-month-${y}-${m}`);
  if (el) el.scrollIntoView({ behavior:"smooth", block:"start" });
  const label = document.getElementById("calCurrentLabel");
  if (label) label.textContent = new Date(y, m, 1).toLocaleDateString("en-US", { month:"long", year:"numeric" });
}

// Scroll-spy: keep the sticky label in sync with whichever month is actually in
// view, instead of only updating on Prev/Next clicks.
let calendarScrollObserver = null;
function initCalendarScrollSync(){
  if (calendarScrollObserver) calendarScrollObserver.disconnect();
  const sections = document.querySelectorAll(".cal-month-section");
  const label = document.getElementById("calCurrentLabel");
  if (!sections.length || !label) return;
  calendarScrollObserver = new IntersectionObserver((entries) => {
    let best = null;
    entries.forEach(e => {
      if (e.isIntersecting && (!best || e.intersectionRatio > best.intersectionRatio)) best = e;
    });
    if (best){
      const m = best.target.id.match(/cal-month-(\d+)-(\d+)/);
      if (m){
        const y = parseInt(m[1], 10), mo = parseInt(m[2], 10);
        state.calYear = y;
        state.calMonth = mo;
        label.textContent = new Date(y, mo, 1).toLocaleDateString("en-US", { month:"long", year:"numeric" });
      }
    }
  }, { rootMargin:"-120px 0px -60% 0px", threshold:[0, 0.25, 0.5, 0.75, 1] });
  sections.forEach(s => calendarScrollObserver.observe(s));
}

function renderMonthSection(year, month){
  const monthLabel = new Date(year, month, 1).toLocaleDateString("en-US", { month:"long", year:"numeric" });
  const totalDays = daysInMonth(year, month);
  const startWeekday = firstWeekdayOfMonth(year, month);
  const todayStr = todayISO();

  let cells = "";
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= totalDays; d++){
    const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const entries = collectGamesForDate(dateStr);
    const isToday = dateStr === todayStr;
    const weekdayLabel = WEEKDAY_ABBR[(startWeekday + d - 1) % 7];
    cells += `<div class="cal-cell${isToday ? " is-today" : ""}">
      <div class="cal-daynum"><span class="cal-cell-dow">${weekdayLabel}</span>${d}</div>
      ${entries.map(calendarEntryHTML).join("")}
    </div>`;
  }
  const trailing = (7 - ((startWeekday + totalDays) % 7)) % 7;
  for (let i = 0; i < trailing; i++) cells += `<div class="cal-cell empty"></div>`;

  return `
    <div class="cal-month-section" id="cal-month-${year}-${month}">
      <div class="cal-month-heading">${monthLabel}</div>
      <div class="cal-grid">
        <div class="cal-dow cal-dow-header">Sun</div><div class="cal-dow cal-dow-header">Mon</div><div class="cal-dow cal-dow-header">Tue</div>
        <div class="cal-dow cal-dow-header">Wed</div><div class="cal-dow cal-dow-header">Thu</div><div class="cal-dow cal-dow-header">Fri</div><div class="cal-dow cal-dow-header">Sat</div>
        ${cells}
      </div>
    </div>`;
}

function renderCalendar(){
  const initialLabel = new Date(state.calYear, state.calMonth, 1).toLocaleDateString("en-US", { month:"long", year:"numeric" });
  const sections = SEASON_MONTHS.map(([y, m]) => renderMonthSection(y, m)).join("");
  return `
    <h2 class="section-title">Calendar</h2>
    <div class="cal-header">
      <button class="refresh-btn cal-nav-btn" onclick="calNav(-1)">↑ Prev Month</button>
      <div class="cal-month-label" id="calCurrentLabel">${initialLabel}</div>
      <button class="refresh-btn cal-nav-btn" onclick="calNav(1)">Next Month ↓</button>
    </div>
    ${sections}`;
}

function renderContent(){
  const content = document.getElementById("content");
  content.classList.toggle("dashboard-view", state.primary === "dashboard");
  if (state.primary === "dashboard"){
    content.innerHTML = renderDashboard();
    return;
  }
  if (state.primary === "calendar"){
    content.innerHTML = renderCalendar();
    initCalendarScrollSync();
    if (state.calendarJumpPending){
      state.calendarJumpPending = false;
      const el = document.getElementById(`cal-month-${state.calYear}-${state.calMonth}`);
      if (el) el.scrollIntoView({ behavior:"auto", block:"start" });
    }
    return;
  }
  if (state.primary === "cfb" && state.secondary === "main"){
    content.innerHTML = renderCFBMain();
    return;
  }
  if (state.primary === "nfl" && state.secondary === "main"){
    content.innerHTML = renderNFLCompare();
    return;
  }
  if (state.primary === "nfl" && state.secondary === "compare"){
    content.innerHTML = renderNFLCompare();
    return;
  }
  if (state.secondary === "standings"){
    if (state.primary === "cfb") content.innerHTML = renderCFBStandings();
    if (state.primary === "nfl") content.innerHTML = renderNFLStandings();
    if (state.primary === "nhl") content.innerHTML = renderNHLStandings();
    if (state.primary === "mlb") content.innerHTML = renderMLBStandings();
    return;
  }
  content.innerHTML = renderTeamSchedule(state.primary, state.secondary);
}

// Measures the ACTUAL rendered height of the primary nav and the mobile
// sport-tab row, rather than assuming a fixed pixel value — a nav label
// that wraps to two lines (or a viewer's larger system font size) changes
// these heights, and a hardcoded guess caused the sticky rows below them
// to overlap on scroll instead of stacking cleanly.
function syncStickyOffsets(){
  const nav1 = document.querySelector("nav.primary");
  if (nav1 && nav1.offsetHeight) document.documentElement.style.setProperty("--nav1-h", nav1.offsetHeight + "px");
  const nav2 = document.getElementById("dashSportRow");
  if (nav2 && nav2.offsetHeight) document.documentElement.style.setProperty("--nav2-h", nav2.offsetHeight + "px");
}

function renderAll(){
  if (!state.dashActiveSport) state.dashActiveSport = DASHBOARD_COLUMNS[0];
  renderPrimaryNav();
  renderSecondaryNav();
  renderDashSportRow();
  renderDashTeamRow();
  renderContent();
  syncStickyOffsets();
}

renderAll();
fetchAllLiveScores();
window.addEventListener("resize", syncStickyOffsets);
</script>
