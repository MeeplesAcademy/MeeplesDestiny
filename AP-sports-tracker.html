<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Austin's Sports Tracker</title>
<style>
  :root{
    --bg: #f5f6f4;
    --panel: #ffffff;
    --border: #d8dad4;
    --text: #1c1f1c;
    --text-mute: #5b5f58;
    --accent: #2b2f2a;
    /* Measured (not guessed) at runtime by syncStickyOffsets() — a label
       that wraps to two lines (or a larger system font size) changes these
       real heights, and hardcoding them caused the sticky rows below to
       overlap the primary nav on scroll. Fallback values here only matter
       for the instant before that first measurement runs. */
    --nav1-h: 46px;
    --nav2-h: 44px;

    --uw-1:#4b2e83;  --uw-2:#b7a57a;
    --sea-1:#002244; --sea-2:#69be28;
    --buf-1:#00338d; --buf-2:#c60c30;
    --skk-1:#355464; --skk-2:#68a2b9;
    --sea-m-1:#0c2c56; --sea-m-2:#005c5c;

    /* Placeholder colors for the Other Sports teams — swap these out once
       Austin sends real colors for the Sounders, Silvertips, and Reign FC. */
    --snd-1:#5d9741; --snd-2:#005595;
    --evt-1:#154734; --evt-2:#9e652e;
    --rgn-1:#2e407a; --rgn-2:#d0a66b;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:Verdana, Geneva, sans-serif;
    font-size:13px;
    line-height:1.5;
  }

  header.site-head{
    padding:18px 28px 14px;
    border-bottom:1px solid var(--border);
    background:var(--panel);
  }
  header.site-head h1{
    margin:0;
    font-size:19px;
    letter-spacing:.2px;
    font-weight:bold;
  }
  header.site-head p{
    margin:4px 0 0;
    color:var(--text-mute);
    font-size:12px;
  }

  nav.primary{
    display:flex;
    gap:2px;
    padding:0 28px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:20;
  }
  nav.primary button{
    font-family:inherit;
    font-size:16px;
    font-weight:bold;
    background:none;
    border:none;
    padding:11px 16px;
    cursor:pointer;
    color:var(--text-mute);
    border-bottom:3px solid transparent;
    margin-bottom:-1px;
  }
  nav.primary button:hover{ color:var(--text); }
  nav.primary button.active{
    color:var(--text);
    border-bottom:3px solid var(--accent);
  }

  nav.secondary{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:14px 28px 0;
  }
  nav.secondary button{
    font-family:inherit;
    font-size:12px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:6px 13px;
    cursor:pointer;
    color:var(--text-mute);
  }
  nav.secondary button.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  nav.secondary button .dot{
    display:inline-block;
    width:8px;height:8px;
    border-radius:50%;
    margin-right:6px;
    vertical-align:middle;
    position:relative;
    top:-1px;
  }
  nav.secondary button .pill-logo{
    width:18px;
    height:18px;
    object-fit:contain;
    margin-right:6px;
    vertical-align:middle;
    position:relative;
    top:-1px;
  }

  main{ padding:20px 28px 60px; }
  main.dashboard-view{ max-width:1760px; margin:0 auto; }

  .note{
    font-size:11px;
    color:var(--text-mute);
    font-style:italic;
    margin:0 0 16px;
    padding:8px 12px;
    background:#fbf6e8;
    border:1px solid #ecdfb0;
    border-radius:4px;
  }
  .refresh-btn{
    font-family:inherit;
    font-style:normal;
    font-size:10px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:2px 9px;
    margin-left:6px;
    cursor:pointer;
    color:var(--text);
  }
  .refresh-btn:hover{ background:#f1f4ee; }
  .last-refreshed{
    font-size:11px;
    color:var(--text-mute);
    font-style:italic;
    margin:4px 0 8px;
  }
  .refresh-btn.refresh-btn-lg{
    font-size:13px;
    padding:6px 16px;
    border-radius:14px;
    border:2px solid var(--accent);
  }
  .week-toggle-btn{
    margin-left:auto;
    font-family:inherit;
    font-size:13px;
    font-weight:bold;
    padding:6px 16px;
    border-radius:14px;
    border:none;
    cursor:pointer;
    background:var(--uw-1);
    color:#fff;
  }
  .week-toggle-btn:hover{ opacity:.85; }

  /* ---- Calendar tab ---- */
  .cal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
    padding:10px 4px;
    position:sticky;
    top:var(--nav1-h);
    background:var(--bg);
    z-index:5;
    border-bottom:1px solid var(--border);
  }
  .cal-header .refresh-btn.cal-nav-btn{
    font-size:14px;
    padding:8px 16px;
    margin-left:0;
  }
  .cal-month-label{
    font-size:18px;
    font-weight:bold;
  }
  .cal-month-section{
    margin-bottom:32px;
  }
  .cal-month-heading{
    font-size:16px;
    font-weight:bold;
    margin-bottom:10px;
    padding-bottom:6px;
    border-bottom:1px solid var(--border);
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:4px;
  }
  .cal-dow{
    font-size:13px;
    font-weight:bold;
    text-transform:uppercase;
    letter-spacing:.4px;
    color:var(--text-mute);
    text-align:center;
    padding:4px 0 8px;
  }
  .cal-cell{
    border:1px solid var(--border);
    border-radius:4px;
    min-height:88px;
    padding:6px;
    background:var(--panel);
  }
  .cal-cell.empty{
    border:none;
    background:transparent;
  }
  .cal-cell.is-today{
    border:3px solid var(--accent);
    padding:4px;
  }

  /* ---- Dashboard "This Week" strip (8 days: Sun through next Sun) ---- */
  .week-grid{
    display:grid;
    grid-template-columns:repeat(8, 1fr);
    gap:8px;
    margin-bottom:12px;
  }
  .week-grid.collapsed{ display:none; }
  @media (max-width:900px){
    .week-grid{ grid-template-columns:repeat(4, 1fr); }
  }
  @media (max-width:520px){
    .week-grid{ grid-template-columns:repeat(2, 1fr); }
  }
  .cal-daynum{
    font-size:13px;
    font-weight:bold;
    color:var(--text-mute);
    margin-bottom:4px;
  }
  .cal-cell-dow{
    display:none;
    font-weight:bold;
    margin-right:6px;
    color:var(--text-mute);
  }
  .cal-entry{
    background:var(--tc);
    color:var(--tc-text);
    border-radius:4px;
    padding:5px 7px;
    font-size:12px;
    line-height:1.35;
    margin-bottom:3px;
  }
  .cal-entry-team{ font-weight:bold; }
  .showcase-badge{
    display:inline-block;
    height:18px;
    width:auto;
    object-fit:contain;
    vertical-align:middle;
    margin-right:4px;
    border-radius:2px;
  }
  .cal-entry.showcase-entry{
    background:var(--panel);
    border:1px dashed #9a9d97;
    color:var(--text);
  }
  .cal-entry.showcase-entry .showcase-badge{
    height:20px;
    display:block;
    margin:0 0 3px;
  }
  .cal-entry.showcase-entry .cal-entry-matchup{
    margin-top:0;
  }
  .cal-entry-meta{
    display:block;
    opacity:.85;
    font-size:11px;
    margin-top:1px;
  }
  @media (max-width:700px){
    /* Month calendar cascades to single-column, full-width day boxes
       instead of squeezing 7 columns down to unreadable slivers. The
       shared weekday header only makes sense with 7 columns, so it's
       hidden in favor of a per-cell weekday label (same idea as the This
       Week strip's per-cell day labels). */
    .cal-grid{ grid-template-columns:1fr; gap:8px; }
    .cal-dow-header{ display:none; }
    .cal-grid .cal-cell.empty{ display:none; }
    .cal-cell-dow{ display:inline; }
  }

  h2.section-title{
    font-size:14px;
    margin:22px 0 10px;
    padding-bottom:6px;
    border-bottom:1px solid var(--border);
  }
  h2.section-title:first-child{ margin-top:0; }
  h2.section-title.header-with-logo{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .col-heading.header-with-logo{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .header-logo{
    width:28px;
    height:28px;
    object-fit:contain;
    flex-shrink:0;
  }

  /* ---- Dashboard tiles ---- */
  .dash-columns{
    display:grid;
    grid-template-columns:repeat(4, minmax(0, 1fr));
    gap:20px;
  }
  .dash-columns.other-sports{
    grid-template-columns:repeat(3, minmax(0, 1fr));
  }
  .dash-col h3{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.6px;
    color:var(--text-mute);
    margin:0 0 10px;
    padding-bottom:6px;
    border-bottom:1px solid var(--border);
  }
  .dash-col h3.dash-col-link{
    cursor:pointer;
  }
  .dash-col h3.dash-col-link:hover{
    color:var(--text);
    border-bottom-color:var(--accent);
  }
  .dash-col-tiles{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .dash-col-standings{
    display:flex;
    flex-direction:column;
    gap:14px;
    min-width:0;
  }
  .dash-col-standings table.standings{
    font-size:11px;
    min-width:0;
    overflow-x:auto;
  }
  .dash-col-standings table.standings th,
  .dash-col-standings table.standings td{
    padding:4px 5px;
  }
  .dash-standings-block{ margin-bottom:4px; }
  .dash-standings-label{
    font-size:11px;
    font-weight:bold;
    text-transform:uppercase;
    letter-spacing:.4px;
    color:var(--text-mute);
    margin-bottom:4px;
  }
  .dash-standings-link{
    font-size:12px;
    font-weight:bold;
    color:var(--accent);
    cursor:pointer;
    text-align:center;
    padding:6px;
    border:1px solid var(--border);
    border-radius:4px;
  }
  .dash-standings-link:hover{ background:#f1f4ee; }
  .external-standings-link{
    display:inline-block;
    font-size:12px;
    color:var(--text-mute);
    text-decoration:none;
    border:1px solid var(--border);
    border-radius:14px;
    padding:6px 14px;
  }
  .external-standings-link:hover{ background:#f1f4ee; color:var(--text); }
  .dash-tile{
    background: color-mix(in srgb, var(--tc1) 12%, var(--panel));
    border:1px solid var(--border);
    border-top:4px solid var(--tc1);
    border-radius:4px;
    padding:12px 16px;
    cursor:pointer;
    min-height:82px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:6px;
  }
  .dash-tile:hover{
    background: color-mix(in srgb, var(--tc1) 20%, var(--panel));
    border-color:#b9bcb4;
  }
  .dash-tile .league-tag{
    font-size:10px;
    color:var(--text-mute);
    text-transform:uppercase;
    letter-spacing:.5px;
    white-space:nowrap;
  }
  .dash-tile-full .team-name{
    font-weight:bold;
    font-size:18px;
    margin:2px 0 8px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    min-width:0;
  }
  .tile-top{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:2px;
    min-width:0;
  }
  .tile-top .team-name{ margin:0; }
  .tile-record{
    margin-left:auto;
    flex-shrink:0;
    font-size:15px;
    font-weight:bold;
    color:var(--text);
  }

  /* ---- Favorite Teams dashboard cards (full schedule) ---- */
  .dash-tile-full{
    background: color-mix(in srgb, var(--tc1) 8%, var(--panel));
    border:1px solid var(--border);
    border-left:5px solid var(--tc1);
    border-radius:4px;
    padding:12px 16px;
    margin-bottom:14px;
  }
  .dash-tile-full .tile-top{ cursor:pointer; margin-bottom:6px; }
  .dash-tile-full.secondary{ opacity:.94; }
  .tile-full-schedule{
    display:flex;
    flex-direction:column;
  }
  .tile-window-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:8px;
    padding-bottom:8px;
    border-bottom:1px solid var(--border);
  }
  .tile-window-note{
    font-size:11px;
    font-weight:bold;
    text-transform:uppercase;
    letter-spacing:.4px;
    color:var(--text-mute);
  }
  .tile-full-schedule-btn{
    font-family:inherit;
    font-size:12px;
    font-weight:bold;
    color:var(--accent);
    background:none;
    cursor:pointer;
    border:1px solid var(--border);
    border-radius:14px;
    padding:5px 12px;
  }
  .tile-full-schedule-btn:hover{ background:#f1f4ee; }
  .tile-sched-row{
    display:flex;
    flex-direction:column;
    gap:3px;
    font-size:12px;
    padding:5px 2px;
    border-top:1px solid color-mix(in srgb, var(--tc1) 12%, var(--border));
  }
  .tile-sched-row:first-child{ border-top:none; }
  .tile-sched-row.bye{
    display:flex;
    flex-direction:row;
    gap:8px;
    color:var(--text-mute);
    font-style:italic;
  }
  .tile-sched-row.bold{
    font-weight:bold;
    background: color-mix(in srgb, var(--tc1) 18%, var(--panel));
    border-radius:3px;
    padding:7px 8px;
    margin:2px -6px;
    border-top:none;
  }
  .tsc-line1{
    display:flex;
    align-items:baseline;
    gap:7px;
  }
  .tsc-date{ flex:0 0 auto; white-space:nowrap; }
  .tsc-time{ flex:0 0 auto; white-space:nowrap; color:var(--text-mute); }
  .tile-sched-row.bold .tsc-time{ color:inherit; }
  .tsc-opp{
    flex:1 1 auto;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-width:0;
  }
  .tsc-result{
    display:flex;
    justify-content:flex-end;
    align-items:baseline;
    gap:8px;
  }
  .tsc-score, .tsc-record{ text-align:right; white-space:nowrap; }
  .tile-logo{
    width:44px;
    height:44px;
    object-fit:contain;
    flex-shrink:0;
  }
  .dash-tile .next-game-label{
    font-size:10px;
    color:var(--text-mute);
    margin-bottom:2px;
  }
  .dash-tile .next-game{ font-size:12px; }
  .tile-game-bold{
    font-size:13px;
    font-weight:bold;
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .dash-tile.secondary{ opacity:.92; }

  @media (max-width:760px){
    .dash-columns, .dash-columns.other-sports{ grid-template-columns:1fr; }
  }

  /* ---- Dashboard mobile nav: sport-tab row (level 2) + team-pill row
     (level 3), sticky below the primary nav on narrow only. Wide keeps the
     existing side-by-side columns with their own inline pills untouched. ---- */
  .dash-sport-row, .dash-team-row{ display:none; }
  @media (max-width:760px){
    .dash-sport-row.shown, .dash-team-row.shown{
      display:flex;
      flex-wrap:nowrap;
      gap:8px;
      padding:8px 28px;
      background:var(--bg);
      border-bottom:1px solid var(--border);
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .dash-sport-row.shown::-webkit-scrollbar, .dash-team-row.shown::-webkit-scrollbar{ display:none; }
    .dash-sport-row.shown{ position:sticky; top:var(--nav1-h); z-index:16; }
    .dash-team-row.shown{ position:sticky; top:calc(var(--nav1-h) + var(--nav2-h)); z-index:15; }
    .dash-sport-row .pill{
      flex:0 0 auto;
      white-space:nowrap;
      font-family:inherit;
      font-size:12px;
      font-weight:bold;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:14px;
      padding:6px 14px;
      cursor:pointer;
      color:var(--text-mute);
    }
    .dash-sport-row .pill.active{
      background:var(--accent);
      color:#fff;
      border-color:var(--accent);
    }
    .dash-team-row .poll-tab-btn{ flex:0 0 auto; white-space:nowrap; }
    /* True tabs: only the active sport's column exists on screen at all. */
    .dash-col{ display:none; }
    .dash-col.active-sport{ display:block; }
    /* The sticky team-row replaces each column's own inline pill row, so
       hide the inline copy to avoid showing the same pills twice. */
    .dash-col-team-pills{ display:none; }
  }

  /* ---- 3-column main pages (CFB overview) ---- */
  .main-3col{
    display:grid;
    grid-template-columns:1fr 1.1fr 1fr;
    gap:18px;
    align-items:start;
  }
  .main-3col.with-rankings{
    grid-template-columns:1fr 1.3fr;
  }
  .col-heading{
    font-size:16px;
    font-weight:bold;
    margin:0 0 10px;
    padding-bottom:6px;
    border-bottom:1px solid var(--border);
  }
  .col-heading.heading-with-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .col-heading.heading-with-btn .refresh-btn{
    margin-left:0;
    font-weight:normal;
  }
  .poll-tab-group{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .poll-tab-btn{
    font-family:inherit;
    font-size:13px;
    font-weight:bold;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:6px 14px;
    cursor:pointer;
    color:var(--text-mute);
  }
  .poll-tab-btn:hover{ color:var(--text); border-color:#b9bcb4; }
  .poll-tab-btn.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  @media (max-width:900px){
    .main-3col{ grid-template-columns:1fr; }
    .main-3col.with-rankings{ grid-template-columns:1fr; }
  }

  /* ---- Compact AP poll (narrow column on CFB main page) ---- */
  .poll-compact table.standings{ font-size:11px; }
  .poll-compact table.standings th,
  .poll-compact table.standings td{ padding:4px 5px; }
  .poll-compact .team-cell{
    display:block;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:100px;
  }

  /* ---- Schedule comparison (NFL) ---- */
  .compare-grid{
    display:grid;
    grid-template-columns:80px repeat(4, 1fr);
    gap:10px;
    align-items:stretch;
  }
  .compare-grid .cmp-head{
    font-size:19px;
    font-weight:bold;
    text-transform:none;
    letter-spacing:.2px;
    color:var(--text);
    padding:4px 0;
  }
  .compare-grid .cmp-head.header-with-logo{ gap:12px; }
  .compare-grid .cmp-head .header-logo{
    width:52px;
    height:52px;
  }
  .compare-grid .cmp-week{
    font-size:14px;
    font-weight:bold;
    color:var(--text);
    display:flex;
    align-items:center;
  }
  .cmp-cell{
    background:var(--panel);
    border:1px solid var(--border);
    border-left:4px solid var(--tc1);
    border-radius:4px;
    padding:10px 12px;
    font-size:15px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .cmp-cell.is-home{
    background: color-mix(in srgb, var(--tc1) 16%, var(--panel));
    border-left-color: var(--tc1);
  }
  .cmp-cell.is-away{
    background: var(--panel);
    border-left-color: var(--tc2, var(--tc1));
  }
  .cmp-cell-main{ min-width:0; }
  .cmp-cell .cmp-opp{ font-weight:bold; }
  .cmp-cell .cmp-meta{
    display:block;
    font-size:13px;
    color:var(--text-mute);
    margin-top:3px;
  }
  .cmp-cell-score{
    flex-shrink:0;
    text-align:right;
    font-size:14px;
  }
  .cmp-cell-record{
    font-size:13px;
    font-weight:bold;
    color:var(--text-mute);
    margin-top:2px;
  }
  .cmp-cell.bye{
    color:var(--text-mute);
    font-style:italic;
    border-left-color:#c9ccc4;
  }

  /* ---- Game cards ---- */
  .game-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .game-card{
    display:grid;
    grid-template-columns:90px 1fr 110px;
    align-items:center;
    gap:14px;
    background:var(--panel);
    border:1px solid var(--border);
    border-left:5px solid var(--tc1);
    border-radius:4px;
    padding:12px 16px;
    cursor:pointer;
  }
  .game-card:hover{ background:#fbfbf9; }
  /* Home games: shaded with the team's dark/primary color (jersey-at-home feel). */
  .game-card.is-home{
    background: color-mix(in srgb, var(--tc1) 16%, var(--panel));
    border-left-color: var(--tc1);
  }
  .game-card.is-home:hover{
    background: color-mix(in srgb, var(--tc1) 22%, var(--panel));
  }
  /* Away games: light/white background, colored trim from the team's secondary color. */
  .game-card.is-away{
    background: var(--panel);
    border-left-color: var(--tc2, var(--tc1));
  }
  .game-card.is-away:hover{
    background: color-mix(in srgb, var(--tc2, var(--tc1)) 8%, var(--panel));
  }
  .game-card .date{
    font-size:13px;
    font-weight:bold;
    color:var(--text);
  }
  .game-card-main{ min-width:0; }
  .game-card-opp{
    font-size:15px;
    font-weight:bold;
    line-height:1.3;
  }
  .game-card-tv{
    font-size:12px;
    color:var(--text-mute);
    margin-top:2px;
    line-height:1.3;
  }
  .game-card .score{
    font-size:15px;
    font-weight:bold;
    text-align:right;
  }
  .game-card .score .wl-tag{
    font-size:15px;
    font-weight:bold;
  }
  .game-card .score.scheduled{
    font-weight:normal;
    color:var(--text-mute);
    font-size:12px;
  }
  .game-card-record{
    font-size:14px;
    font-weight:bold;
    color:var(--text-mute);
    margin-top:2px;
  }

  @media (max-width:640px){
    .game-card{ grid-template-columns:1fr; text-align:left; }
    .game-card .score{ text-align:left; }
  }

  /* Individual team schedule pages: condensed left column, not full page width. */
  .schedule-narrow{
    max-width:540px;
  }

  /* ---- Month-grouped collapsible schedule (long seasons: MLB/NHL) ---- */
  .month-toolbar{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .month-toolbar .refresh-btn{
    font-size:12px;
    padding:5px 14px;
    margin-left:0;
  }
  .month-group{
    margin-bottom:10px;
  }
  .month-header{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:4px;
    padding:11px 14px;
    cursor:pointer;
    font-family:inherit;
    font-size:14px;
    font-weight:bold;
    text-align:left;
    color:var(--text);
  }
  .month-header:hover{
    background:#f1f4ee;
    border-color:#b9bcb4;
  }
  .month-chevron{
    display:inline-block;
    font-size:11px;
    color:var(--text-mute);
    transition:transform 0.15s ease;
    flex-shrink:0;
  }
  .month-header:not(.collapsed) .month-chevron{
    transform:rotate(90deg);
  }
  .month-title{ flex-shrink:0; }
  .month-record{
    margin-left:auto;
    font-weight:normal;
    font-size:12px;
    color:var(--text-mute);
    white-space:nowrap;
  }
  .month-body{
    margin-top:8px;
  }

  /* ---- Standings ---- */
  table.standings{
    width:100%;
    border-collapse:collapse;
    background:var(--panel);
    font-size:12px;
    margin-bottom:18px;
  }
  table.standings caption{
    text-align:left;
    font-weight:bold;
    font-size:12px;
    padding:8px 0 6px;
  }
  table.standings th{
    text-align:left;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.4px;
    color:var(--text-mute);
    border-bottom:1px solid var(--border);
    padding:6px 8px;
  }
  table.standings td{
    padding:6px 8px;
    border-bottom:1px solid #eceee9;
  }
  table.standings tr.my-team td{
    background: color-mix(in srgb, var(--rowc, #cfd4c8) 18%, var(--panel));
    font-weight:bold;
  }
  .standings-groups{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px,1fr));
    gap:0 24px;
    overflow-x:auto;
    min-width:0;
  }
  .standings-2col{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
    align-items:start;
  }
  .standings-3col{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:24px;
    align-items:start;
  }
  @media (max-width:800px){
    .standings-2col{ grid-template-columns:1fr; }
  }
  @media (max-width:1100px){
    .standings-3col{ grid-template-columns:1fr 1fr; }
  }
  @media (max-width:700px){
    .standings-3col{ grid-template-columns:1fr; }
  }
  @media (max-width:900px){
    .standings-row{ grid-template-columns:repeat(2,1fr) !important; }
  }
  @media (max-width:560px){
    .standings-row{ grid-template-columns:1fr !important; }
  }
  .nfl-standings-wrap table.standings{
    font-size:14px;
  }
  .nfl-standings-wrap table.standings caption{
    font-size:15px;
    padding:10px 0 8px;
  }
  .nfl-standings-wrap table.standings th{
    font-size:12px;
    padding:8px 10px;
  }
  .nfl-standings-wrap table.standings td{
    padding:8px 10px;
  }
</style>
</head>

function cumulativeRecordThrough(games, game){
  let w = 0, l = 0, t = 0;
  for (const gm of games){
    if (gm.status === "final"){
      if (gm.score.team > gm.score.opp) w++;
      else if (gm.score.team < gm.score.opp) l++;
      else t++;
    }
    if (gm === game) break;
  }
  return t > 0 ? `${w}-${l}-${t}` : `${w}-${l}`;
}

function gameCardHTML(g, team, allGames){
  if (g.status === "bye"){
    return `
      <div class="game-card" style="--tc1:#c9ccc4; opacity:.65; cursor:default;">
        <div class="date">${fmtDate(g.date)}</div>
        <div class="game-card-main">
          <div class="game-card-opp">Bye Week</div>
        </div>
        <div class="score scheduled">—</div>
      </div>`;
  }
  let scoreHTML;
  if (g.status === "final"){
    const win = g.score.team > g.score.opp;
    const record = allGames ? cumulativeRecordThrough(allGames, g) : "";
    scoreHTML = `<div class="score">
      <div>${g.score.team}-${g.score.opp} <span class="wl-tag" style="color:${win ? '#2f7a2f' : '#a33'}">${win ? "W" : "L"}</span></div>
      ${record ? `<div class="game-card-record">${record}</div>` : ""}
    </div>`;
  } else {
    scoreHTML = `<div class="score scheduled">Scheduled</div>`;
  }
  const homeAwayClass = g.home ? "is-home" : "is-away";
  return `
    <div class="game-card ${homeAwayClass}" style="--tc1:${team.c1}; --tc2:${team.c2}">
      <div class="date">${fmtDate(g.date)}</div>
      <div class="game-card-main">
        <div class="game-card-opp">${g.home ? "vs" : "@"} ${g.opp}</div>
        <div class="game-card-tv">${g.tv || "TV TBD"} · ${g.home ? "Home" : "Away"}</div>
      </div>
      ${scoreHTML}
    </div>`;
}

// Collapse state persists across re-renders (e.g. a live-score refresh)
// rather than resetting whenever the page redraws. Keyed per team+month so
// each team's toggle state is independent.
let MONTH_COLLAPSE_STATE = {};

function monthStateKey(teamKey, year, month){ return `${teamKey}:${year}-${month}`; }

function groupGamesByMonth(games){
  const groups = [];
  let current = null;
  games.forEach(g => {
    const [y, m] = g.date.split("-").map(Number);
    if (!current || current.year !== y || current.month !== m){
      current = { year:y, month:m, games:[] };
      groups.push(current);
    }
    current.games.push(g);
  });
  return groups;
}

function recordFor(games){
  let w = 0, l = 0;
  games.forEach(g => {
    if (g.status === "final"){
      if (g.score.team > g.score.opp) w++;
      else if (g.score.team < g.score.opp) l++;
    }
  });
  return { w, l };
}

function toggleMonth(key){
  MONTH_COLLAPSE_STATE[key] = !MONTH_COLLAPSE_STATE[key];
  renderAll();
}

function setAllMonths(teamKey, collapsed){
  Object.keys(MONTH_COLLAPSE_STATE).forEach(k => {
    if (k.startsWith(teamKey + ":")) MONTH_COLLAPSE_STATE[k] = collapsed;
  });
  renderAll();
}

function renderMonthGroupedSchedule(teamKey, team, games){
  const groups = groupGamesByMonth(games);
  let cumW = 0, cumL = 0;
  const sections = groups.map(grp => {
    const { w, l } = recordFor(grp.games);
    cumW += w; cumL += l;
    const allFinal = grp.games.every(g => g.status === "final");
    const key = monthStateKey(teamKey, grp.year, grp.month);
    // Default collapsed only the first time we ever see this month, and only
    // if every game in it is already final — future visits respect whatever
    // the user last set, even after a live-score re-render.
    if (!(key in MONTH_COLLAPSE_STATE)) MONTH_COLLAPSE_STATE[key] = allFinal;
    const collapsed = MONTH_COLLAPSE_STATE[key];
    const monthLabel = `${MONTH_NAMES[grp.month - 1]} ${grp.year}`;
    let recordLabel = "";
    if (allFinal) recordLabel = `${w}-${l}, ${cumW}-${cumL} overall`;
    else if (w + l > 0) recordLabel = `${w}-${l} so far, ${cumW}-${cumL} overall`;
    return `
      <div class="month-group">
        <button class="month-header ${collapsed ? "collapsed" : ""}" onclick="toggleMonth('${key}')">
          <span class="month-chevron">▶</span>
          <span class="month-title">${monthLabel}</span>
          ${recordLabel ? `<span class="month-record">${recordLabel}</span>` : ""}
        </button>
        <div class="month-body" style="display:${collapsed ? "none" : "block"}">
          <div class="game-list">
            ${grp.games.map(g => gameCardHTML(g, team, games)).join("")}
          </div>
        </div>
      </div>`;
  }).join("");
  return `
    <div class="month-toolbar">
      <button class="refresh-btn" onclick="setAllMonths('${teamKey}', false)">Expand All</button>
      <button class="refresh-btn" onclick="setAllMonths('${teamKey}', true)">Collapse All</button>
    </div>
    ${sections}`;
}

function renderTeamSchedule(sportKey, teamKey){

// Row-highlight colors picked for the Dashboard cards, reused here for Standings.
// Live NFL standings — same defensive pattern as the Big Ten/MLB fetches:
// hit ESPN's public standings endpoint, match by team name, fail gracefully.
const ESPN_NFL_STANDINGS_URL = "https://site.api.espn.com/apis/v2/sports/football/nfl/standings?type=0&level=3";
let nflStandingsFetchState = "idle"; // idle | loading | done | failed
let NFL_LIVE_RECORDS = {}; // team full name -> { w, l, t, pct, pf, pa }

// ESPN's displayName doesn't always match our shorthand — "LA Rams" vs
// "Los Angeles Rams", etc. — so check known aliases before giving up on a team.
const NFL_STANDINGS_ALIASES = {
  "LA Rams": ["LA Rams", "Los Angeles Rams"],
  "LA Chargers": ["LA Chargers", "Los Angeles Chargers"]
};

// Tracks when each Refresh button was last actually clicked (regardless of
// success/failure), so the person can tell the click registered even if
// nothing visibly changed on screen.
let REFRESH_TIMES = {};
function refreshTimeLabel(key){
  if (!REFRESH_TIMES[key]) return "";
  return `Refreshed ${REFRESH_TIMES[key].toLocaleTimeString()}`;
}

// Walks the response to find each division's own entries list, keeping the
// division boundary intact — ESPN returns teams within a division already in
// real tiebreak-resolved order (matching their live standings page), and that
// order is exactly what gets lost by flattening everything into one array.
function extractNFLLeafGroups(data){
  if (data?.standings?.entries) return [data.standings.entries];
  const groups = [];
  (data?.children || []).forEach(c => {
    if (c?.standings?.entries?.length) groups.push(c.standings.entries);
    else if (c?.children?.length){
      c.children.forEach(cc => {
        if (cc?.standings?.entries?.length) groups.push(cc.standings.entries);
      });
    }
  });
  return groups;
}

async function fetchNFLStandings(forceRerender){
  nflStandingsFetchState = "loading";
  try {
    const res = await fetch(ESPN_NFL_STANDINGS_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    const leafGroups = extractNFLLeafGroups(data);
    if (!leafGroups.length) throw new Error("Unexpected response shape from ESPN NFL standings API");

    const allTeamNames = NFL_CONF_ORDER.flatMap(conf => NFL_DIV_ORDER.flatMap(div => NFL_STANDINGS[conf][div]));
    const namesByLength = [...allTeamNames].sort((a, b) => b.length - a.length);

    let matched = 0;
    leafGroups.forEach(groupEntries => {
      groupEntries.forEach((entry, idxInGroup) => {
        const displayName = entry?.team?.displayName || entry?.team?.location || entry?.team?.name;
        if (!displayName) return;
        const teamName = namesByLength.find(n => {
          const aliases = NFL_STANDINGS_ALIASES[n] || [n];
          return aliases.some(a => displayName.includes(a));
        });
        if (!teamName) return;
        const stats = entry.stats || [];
        const w = findStatValue(stats, "wins");
        const l = findStatValue(stats, "losses");
        const t = findStatValue(stats, "ties");
        const pct = findStatValue(stats, "winpercent", "pct");
        const pf = findStatValue(stats, "pointsfor", "pf");
        const pa = findStatValue(stats, "pointsagainst", "pa");
        if (w == null || l == null) return;
        // espnRank preserves ESPN's own within-division order — this is what
        // actually reflects real tiebreakers (head-to-head, division record,
        // point differential, etc.), which we have no way to compute ourselves
        // without full game-by-game data for every team in the league.
        NFL_LIVE_RECORDS[teamName] = { w, l, t: t ?? "0", pct: pct ?? "—", pf: pf ?? "—", pa: pa ?? "—", espnRank: idxInGroup };
        matched++;
      });
    });
    if (matched === 0) throw new Error("Fetched NFL standings but couldn't match any team names");
    nflStandingsFetchState = "done";
  } catch (err){
    nflStandingsFetchState = "failed";
    console.warn("NFL standings live fetch failed — showing placeholder data instead.", err);
  }
  REFRESH_TIMES.nfl = new Date();
  if (forceRerender) renderAll();
}

function nflStandingsStatusNote(){
  if (nflStandingsFetchState === "loading") return "Fetching live standings from ESPN…";
  if (nflStandingsFetchState === "done") return "Live data loaded from ESPN just now.";
  if (nflStandingsFetchState === "failed") return "Live fetch didn't come back with usable data — showing placeholders below instead.";
  return "";
}

function nflStandingsRow(teamName, myList){
  const mine = myList.includes(teamName);
  const rowColor = STANDINGS_ROW_COLORS[teamName];
  const styleAttr = rowColor ? ` style="--rowc:${rowColor}"` : "";
  const shaded = mine || !!rowColor;
  const live = NFL_LIVE_RECORDS[teamName];
  const w = live ? live.w : "—";
  const l = live ? live.l : "—";
  const t = live ? live.t : "—";
  const pct = live ? live.pct : "—";
  const pf = live ? live.pf : "—";
  const pa = live ? live.pa : "—";
  return `<tr class="${shaded ? "my-team" : ""}"${styleAttr}>
    <td>${teamName}</td>
    <td>${w}</td><td>${l}</td><td>${t}</td><td>${pct}</td><td>${pf}</td><td>${pa}</td>
  </tr>`;
}

// Prefer ESPN's own within-division order (espnRank) — that already reflects
// real NFL tiebreakers (head-to-head, division record, point differential,
// etc.), which we have no way to compute ourselves from just win/loss totals.
// Only falls back to a wins-desc/losses-asc guess when live rank data isn't
// available for every team in the division yet (e.g. before the first fetch).
function sortNFLDivision(teamNames){
  const allRanked = teamNames.every(n => NFL_LIVE_RECORDS[n] && NFL_LIVE_RECORDS[n].espnRank != null);
  if (allRanked){
    return [...teamNames].sort((a, b) => NFL_LIVE_RECORDS[a].espnRank - NFL_LIVE_RECORDS[b].espnRank);
  }
  return [...teamNames].sort((a, b) => {
    const ra = NFL_LIVE_RECORDS[a], rb = NFL_LIVE_RECORDS[b];
    if (!ra && !rb) return 0;
    if (!ra) return 1;
    if (!rb) return -1;
    const wa = parseInt(ra.w, 10) || 0, wb = parseInt(rb.w, 10) || 0;
    if (wb !== wa) return wb - wa;
    const la = parseInt(ra.l, 10) || 0, lb = parseInt(rb.l, 10) || 0;
    return la - lb;
  });
}

// Same idea as sortNFLDivision, generalized for every other standings table
// (NHL, MLB, and the Other Sports leagues) — none of them were actually
// re-sorting by the live record once it came in, only merging the numbers
// onto whatever order the static team list happened to be typed in. A
// primaryKey (points, win pct — whatever that sport's table leads with) is
// compared first when given, wins/losses always break remaining ties.
// Teams with no live record yet sort to the bottom, keeping their relative
// static order so the table doesn't visibly reshuffle before data loads.
function sortByLiveRecord(teamNames, liveRecords, primaryKey){
  return [...teamNames].sort((a, b) => {
    const ra = liveRecords[a], rb = liveRecords[b];
    if (!ra && !rb) return 0;
    if (!ra) return 1;
    if (!rb) return -1;
    if (primaryKey){
      const pa = parseFloat(ra[primaryKey]) || 0, pb = parseFloat(rb[primaryKey]) || 0;
      if (pb !== pa) return pb - pa;
    }
    const wa = parseInt(ra.w, 10) || 0, wb = parseInt(rb.w, 10) || 0;
    if (wb !== wa) return wb - wa;
    const la = parseInt(ra.l, 10) || 0, lb = parseInt(rb.l, 10) || 0;
    return la - lb;
  });
}

/* =========================================================
   LIVE STANDINGS FETCH — ESPN's public, unauthenticated JSON
   API (used directly from browser JS by many independent
   projects, no key/proxy needed). Wrapped defensively: any
   failure (CORS, network, shape change) just leaves the
   existing table alone rather than breaking the page.
========================================================= */
const ESPN_BIGTEN_STANDINGS_URL = "https://site.api.espn.com/apis/v2/sports/football/college-football/standings?group=5";
let bigTenFetchState = "idle"; // idle | loading | done | failed

// Longest names first so "Michigan State" matches before "Michigan".
const BIG_TEN_NAMES_BY_LENGTH = [...BIG_TEN.map(r => r.team)].sort((a, b) => b.length - a.length);

function matchBigTenTeam(espnDisplayName){
  if (!espnDisplayName) return null;
  return BIG_TEN_NAMES_BY_LENGTH.find(name => espnDisplayName.includes(name)) || null;
}

function parseRecordPair(str){
  const m = /(-?\d+)\D+(-?\d+)/.exec(str || "");
  return m ? { w: parseInt(m[1], 10), l: parseInt(m[2], 10) } : null;
}

async function fetchBigTenStandings(forceRerender){
  bigTenFetchState = "loading";
  try {
    const res = await fetch(ESPN_BIGTEN_STANDINGS_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    // ESPN's standings JSON has shown up under a couple of different shapes
    // over the years — try the plausible paths rather than assuming one.
    let entries = data?.standings?.entries
      || data?.children?.[0]?.standings?.entries
      || (data?.children || []).flatMap(c => c?.standings?.entries || []);
    if (!entries || !entries.length) throw new Error("Unexpected response shape from ESPN standings API");

    let matched = 0;
    entries.forEach(entry => {
      const displayName = entry?.team?.displayName || entry?.team?.name || entry?.team?.shortDisplayName;
      const teamKey = matchBigTenTeam(displayName);
      if (!teamKey) return;
      const row = BIG_TEN.find(r => r.team === teamKey);
      if (!row) return;

      const stats = entry.stats || [];
      const overallStat = stats.find(s => /^overall$/i.test(s.name) || /^total$/i.test(s.type));
      // ESPN's response includes a whole family of stats prefixed "vsconf_"
      // (games back, point differential, streak, etc. — computed within the
      // conference-only context) alongside the one real conference W-L
      // record, whose type is the bare, unsuffixed "vsconf". The old
      // unanchored /vsconf/i test matched whichever of those came first in
      // the array — usually "gamesBehind" — whose "-" (no games back yet)
      // parsed to nothing, and whose "0.5" (half a game back) got its
      // decimal point misread as a W-L separator by parseRecordPair below,
      // producing a bogus "0-5". Requiring an exact type (or name) match
      // picks the actual record stat instead of a same-family neighbor.
      const confStat = stats.find(s => s.type === "vsconf") || stats.find(s => /^vs\.?\s*conf\.?$/i.test(s.name || ""));
      // Same family-collision risk as the conference record above — there's
      // likely a "vsconf_streak" (and possibly "vsaprankedteams_streak")
      // alongside the actual overall streak. Preferring an exact-type match
      // first avoids grabbing a same-named neighbor from the wrong category.
      const streakStat = stats.find(s => s.type === "total_streak") || stats.find(s => /streak/i.test(s.name || ""));

      const overall = parseRecordPair(overallStat?.displayValue || overallStat?.summary);
      const conf = parseRecordPair(confStat?.displayValue || confStat?.summary);

      // Capture the previously-known overall total BEFORE this fetch's
      // value overwrites row.ovrW/row.ovrL below — otherwise "prior" and
      // "this fetch" would read as the same number and the staleness
      // protection a few lines down would do nothing.
      const priorOverallTotal = (row.ovrW || 0) + (row.ovrL || 0);

      if (overall){ row.ovrW = overall.w; row.ovrL = overall.l; row.known = true; matched++; }

      // A conference record can never involve more games than the team's
      // overall record — conference games are a subset of all games played.
      // Reject an implausible parse (e.g. "0-5" for a team that's 3-0
      // overall) instead of displaying it; this has been happening when
      // the stat-matching heuristic above grabbed the wrong field out of
      // ESPN's response for some teams.
      //
      // The ceiling uses whichever is larger: this fetch's overall total,
      // or the overall total already stored from a previous successful
      // fetch. Right after a game ends, ESPN's own response can have the
      // conference stat updated before the overall stat catches up in that
      // same payload — comparing only against this fetch's (briefly stale)
      // overall would wrongly reject a conference record that just became
      // correct, which is exactly backwards from the intent here.
      const thisOverallTotal = overall ? overall.w + overall.l : 0;
      const overallCeiling = Math.max(priorOverallTotal, thisOverallTotal);
      const confPlausible = conf && (overallCeiling === 0 || (conf.w + conf.l) <= overallCeiling);
      if (confPlausible){ row.confW = conf.w; row.confL = conf.l; }
      if (streakStat?.displayValue) row.streak = streakStat.displayValue;
    });

    if (matched === 0) throw new Error("Fetched standings but couldn't match any team names");
    bigTenFetchState = "done";
  } catch (err){
    bigTenFetchState = "failed";
    console.warn("Big Ten live standings fetch failed — showing last-known data instead.", err);
  }
  REFRESH_TIMES.bigten = new Date();
  if (forceRerender) renderAll();
}

function bigTenFetchStatusNote(){
  if (bigTenFetchState === "loading") return "Fetching live standings from ESPN…";
  if (bigTenFetchState === "done") return "Live data loaded from ESPN just now.";
  if (bigTenFetchState === "failed") return "Live fetch didn't come back with usable data (could be CORS, a network hiccup, or ESPN changing their response shape) — showing the last-known data below instead.";
  return "";
}

/* ---- AP Top 25 — same live-fetch-with-fallback pattern as Big Ten standings ---- */
const ESPN_RANKINGS_URL = "https://site.api.espn.com/apis/site/v2/sports/football/college-football/rankings";
let apPollFetchState = "idle"; // idle | loading | done | failed

const AP_POLL_ALIASES = {
  "BYU": ["BYU", "Brigham Young"],
  "Ole Miss": ["Ole Miss", "Mississippi Rebels", "Mississippi"],
  "Texas A&M": ["Texas A&M"],
  "SMU": ["SMU", "Southern Methodist"]
};
const AP_POLL_NAMES_BY_LENGTH = [...AP_POLL].sort((a, b) => b.team.length - a.team.length);

// ESPN's team object shape varies by response — sometimes displayName is the full
// "School Mascot" combo, sometimes it's mascot-only and the school name only shows
// up in location/name/shortDisplayName. Check every candidate field rather than
// assuming one; a match failure here used to fail silently (stale data) or, worse,
// get treated as a brand-new team and overwrite the correct school name with a
// mascot-only one.
function apTeamCandidates(team){
  if (!team) return [];
  return [team.location, team.displayName, team.name, team.shortDisplayName].filter(Boolean);
}

function matchApTeam(team){
  const candidates = apTeamCandidates(team);
  if (!candidates.length) return null;
  for (const row of AP_POLL_NAMES_BY_LENGTH){
    const aliases = AP_POLL_ALIASES[row.team] || [row.team];
    if (aliases.some(a => candidates.some(c => c.includes(a)))) return row;
  }
  return null;
}

// College Football Playoff committee rankings — same ESPN endpoint/response as the AP
// poll, just a different poll source within it. Empty until the CFP committee starts
// publishing (usually early-to-mid November); this just needs to sit here ready.
let CFP_POLL = [];

async function fetchApPoll(forceRerender){
  apPollFetchState = "loading";
  try {
    const res = await fetch(ESPN_RANKINGS_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    const polls = data?.rankings || [];
    const apPoll = polls.find(p => /^ap top/i.test(p.name || p.shortName || "")) || polls[0];
    const ranks = apPoll?.ranks;
    if (!ranks || !ranks.length) throw new Error("Unexpected response shape from ESPN rankings API");

    // Validate the shape fully before touching AP_POLL at all — a malformed
    // response (e.g. every rank undefined) must never be allowed to wipe out
    // the existing list.
    const ranksLookValid = ranks.every(r => Number.isInteger(r.current));
    if (!ranksLookValid) throw new Error("Rankings entries missing a usable rank number");

    let matched = 0;
    const newlyAdded = [];
    const touched = new Set();
    ranks.forEach(r => {
      let target = matchApTeam(r.team);
      // A team that wasn't in the preseason 25 but has since climbed into the
      // rankings has no existing row to match — add one rather than drop it.
      // Prefer "location" (usually just the school name) over the full
      // displayName so a genuinely new entry still reads as a school name
      // rather than a mascot where possible.
      if (!target){
        const bestName = r.team?.location || r.team?.displayName || r.team?.name || r.team?.shortDisplayName;
        if (bestName){
          target = { rank: r.current, team: bestName, votes:0, record:"0-0", points:0, trend:"NR" };
          newlyAdded.push(target);
        }
      }
      // Deliberately never overwrite an existing target.team — we keep the school name
      // (e.g. "USC") rather than whatever mascot-only name ESPN returns.
      if (target){
        target.rank = r.current ?? target.rank;
        target.votes = r.firstPlaceVotes || 0;
        target.record = r.recordSummary || target.record;
        target.points = r.points ?? target.points;
        target.trend = r.trend || target.trend;
        touched.add(target);
        matched++;
      }
    });
    if (matched === 0) throw new Error("Fetched poll but couldn't match any team names");

    // Only now that we know the fetch was genuinely usable do we mutate the list:
    // add newly-ranked teams, then drop anyone this fetch didn't actually touch
    // (tracked by object identity, not rank number — a rank slot can change hands
    // to a different team entirely, so the old occupant must not survive on a
    // number-only check).
    newlyAdded.forEach(t => { AP_POLL.push(t); AP_POLL_NAMES_BY_LENGTH.push(t); });
    for (let i = AP_POLL.length - 1; i >= 0; i--){
      if (!touched.has(AP_POLL[i])) AP_POLL.splice(i, 1);
    }
    AP_POLL.sort((a, b) => a.rank - b.rank);

    // Same response, different poll source — grab CFP committee rankings if present.
    const cfpPoll = polls.find(p => /college football playoff/i.test(p.name || p.shortName || "") || p.type === "cfp");
    if (cfpPoll?.ranks?.length){
      CFP_POLL = cfpPoll.ranks.map(r => ({
        rank: r.current,
        team: r.team?.location || r.team?.displayName || r.team?.name || "Unknown",
        record: r.recordSummary || "0-0",
        trend: r.trend || "NR"
      }));
    }

    apPollFetchState = "done";
  } catch (err){
    apPollFetchState = "failed";
    console.warn("AP poll live fetch failed — showing last-known data instead.", err);
  }
  REFRESH_TIMES.appoll = new Date();
  if (forceRerender) renderAll();
}

  if (apPollFetchState === "done") return "Live poll loaded from ESPN just now.";

  return "Showing the preseason poll until Week 1 rankings post.";

// Live MLB standings — same pattern as the Big Ten fetch: hit ESPN's public
// standings endpoint, match by team name, fail gracefully (keep placeholders).
const ESPN_MLB_STANDINGS_URL = "https://site.api.espn.com/apis/v2/sports/baseball/mlb/standings?type=0&level=3";
let mlbFetchState = "idle"; // idle | loading | done | failed
let MLB_LIVE_RECORDS = {}; // team full name -> { w, l, pct, gb }

function findStatValue(stats, ...names){
  const stat = stats.find(s => names.some(n => (s.name || "").toLowerCase() === n.toLowerCase()
    || (s.abbreviation || "").toLowerCase() === n.toLowerCase()));
  return stat ? (stat.displayValue ?? stat.value) : null;
}

async function fetchMLBStandings(forceRerender){
  mlbFetchState = "loading";
  try {
    const res = await fetch(ESPN_MLB_STANDINGS_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    // Try the plausible shapes rather than assume one, same approach as the
    // Big Ten / AP poll fetches — ESPN's grouping nests differently per league.
    let entries = data?.standings?.entries
      || data?.children?.[0]?.standings?.entries
      || (data?.children || []).flatMap(c => (c?.standings?.entries) || (c?.children || []).flatMap(cc => cc?.standings?.entries || []));
    if (!entries || !entries.length) throw new Error("Unexpected response shape from ESPN MLB standings API");

    const allTeamNames = Object.values(MLB_STANDINGS).flatMap(league => Object.values(league)).flat();
    const namesByLength = [...allTeamNames].sort((a, b) => b.length - a.length);

    let matched = 0;
    entries.forEach(entry => {
      const displayName = entry?.team?.displayName || entry?.team?.location || entry?.team?.name;
      if (!displayName) return;
      const teamName = namesByLength.find(n => displayName.includes(n));
      if (!teamName) return;
      const stats = entry.stats || [];
      const w = findStatValue(stats, "wins");
      const l = findStatValue(stats, "losses");
      const pct = findStatValue(stats, "winPercent", "pct");
      const gb = findStatValue(stats, "gamesBehind", "gb");
      if (w == null || l == null) return;
      MLB_LIVE_RECORDS[teamName] = { w, l, pct: pct ?? "—", gb: gb ?? "—" };
      matched++;
    });
    if (matched === 0) throw new Error("Fetched MLB standings but couldn't match any team names");
    mlbFetchState = "done";
  } catch (err){
    mlbFetchState = "failed";
    console.warn("MLB standings live fetch failed — showing placeholder data instead.", err);
  }
  REFRESH_TIMES.mlb = new Date();
  if (forceRerender) renderAll();
}

function mlbFetchStatusNote(){
  if (mlbFetchState === "loading") return "Fetching live standings from ESPN…";
  if (mlbFetchState === "done") return "Live data loaded from ESPN just now.";
  if (mlbFetchState === "failed") return "Live fetch didn't come back with usable data — showing placeholders below instead.";
  return "";
}

  return `<tr class="${shaded ? "my-team" : ""}"${styleAttr}>

    <td>${w}</td><td>${l}</td><td>${pct}</td>

// Local (not UTC) YYYY-MM-DD for "today" — avoids an early-morning PT vs UTC date mismatch.
// Every "today" check in this file — upcoming-game filtering, past-game
// formatting, the calendar's default month, all of it — uses this fixed
// zone (Pacific for this file, since Austin is Pacific) rather than the
// viewer's own browser timezone, since every date/time on the page is
// labeled in that zone.
const CALENDAR_TIMEZONE = "America/Los_Angeles";
const ZONE_ABBR = "PT";
function todayISOInZone(timeZone){
  const parts = new Intl.DateTimeFormat("en-US", { timeZone, year:"numeric", month:"2-digit", day:"2-digit" }).formatToParts(new Date());
  const y = parts.find(p => p.type === "year").value;
  const m = parts.find(p => p.type === "month").value;
  const d = parts.find(p => p.type === "day").value;
  return `${y}-${m}-${d}`;
}

// Same conversion as todayISOInZone, but for an arbitrary timestamp (e.g. an
// ESPN event's UTC kickoff time) rather than always "right now" — this is
// what determines a game's real start date in this file's zone, regardless
// of what UTC calendar day it rolls over onto.
function eventDateInZone(isoDateStr, timeZone){
  const parts = new Intl.DateTimeFormat("en-US", { timeZone, year:"numeric", month:"2-digit", day:"2-digit" }).formatToParts(new Date(isoDateStr));
  const y = parts.find(p => p.type === "year").value;
  const m = parts.find(p => p.type === "month").value;
  const d = parts.find(p => p.type === "day").value;
  return `${y}-${m}-${d}`;
}

function todayISO(){
  return todayISOInZone(CALENDAR_TIMEZONE);
}

function nextGames(teamKey, count){
  const today = todayISO();
  const games = (SCHEDULES[teamKey] || []).filter(g => g.status === "scheduled" && g.date >= today);
  return games.slice(0, count);
}

/* =========================================================
   LIVE SCORES — same pattern as standings/rankings: fetch
   ESPN's public team-schedule API, update SCHEDULES in place
   when a game is confirmed final, fail silently otherwise.
   Runs once on load; every view that reads SCHEDULES (game
   cards, Calendar, NFL comparison grid) picks up the update
   automatically on the next render.
========================================================= */
const TEAM_ESPN_META = {
  sea: { sport:"football", league:"nfl", id:"sea" },
  buf: { sport:"football", league:"nfl", id:"buf" },
  uw: { sport:"football", league:"college-football", id:"264" },
  skk: { sport:"hockey", league:"nhl", id:"sea" },
  sea_m: { sport:"baseball", league:"mlb", id:"sea" },
  snd: { sport:"soccer", league:"usa.1", id:"9726" }
  // snd's feed only covers MLS games — it won't touch the Leagues Cup/CCC
  // results already entered above, since those are separate competitions
  // ESPN's MLS schedule endpoint doesn't include.
  // No entries yet for evt/rgn (Other Sports) — live-score fetching for
  // those teams can be wired up once Austin's data is in.
};

let liveScoresFetchState = "idle"; // idle | loading | done | failed

// ESPN's score field shows up as either a plain string/number or an
// {value, displayValue} object depending on which endpoint/era — handle both
// rather than assume one, and never trust a value that doesn't parse cleanly.
function extractEspnScore(competitor){
  if (!competitor) return null;
  const raw = (typeof competitor.score === "object" && competitor.score !== null)
    ? (competitor.score.value ?? competitor.score.displayValue)
    : competitor.score;
  if (raw == null) return null;
  const n = parseInt(raw, 10);
  return Number.isFinite(n) ? n : null;
}

// Formats an ESPN event's UTC timestamp into this file's fixed display zone
// (matches the "H:MMam/pm ZONE" convention used throughout the schedules).
function formatEventTime(isoDateStr, timeZone, zoneAbbr){
  const d = new Date(isoDateStr);
  const parts = new Intl.DateTimeFormat("en-US", { timeZone, hour:"numeric", minute:"2-digit", hour12:true }).formatToParts(d);
  const hour = parts.find(p => p.type === "hour").value;
  const minute = parts.find(p => p.type === "minute").value;
  const dayPeriod = parts.find(p => p.type === "dayPeriod").value.toLowerCase();
  return `${hour}:${minute}${dayPeriod} ${zoneAbbr}`;
}

function extractBroadcastName(comp){
  const b = comp.broadcasts?.[0];
  if (b){
    if (b.name) return b.name;
    if (Array.isArray(b.names) && b.names.length) return b.names[0];
    if (b.shortName) return b.shortName;
    if (b.callLetters) return b.callLetters;
  }
  const gb = comp.geoBroadcasts?.[0];
  if (gb) return gb.media?.shortName || gb.media?.name || null;
  return null;
}

// Whether ESPN has actually assigned a broadcast for this game yet. Networks
// and kickoff times are announced together in practice — an empty broadcasts
// array means the game is still genuinely TBD, and ESPN's date field for it
// is not a real kickoff time (often just a placeholder), so it must not be
// trusted for a time update.
function hasRealBroadcastInfo(comp){
  return !!(comp.broadcasts?.length || comp.geoBroadcasts?.length);
}

async function fetchLiveScoresForTeam(teamKey){
  const meta = TEAM_ESPN_META[teamKey];
  const games = SCHEDULES[teamKey];
  if (!meta || !games) return;
  // seasontype=2 asks ESPN for regular season only — preseason exhibition games
  // (common in Sept for NHL/NFL) must never be treated as real results.
  const url = `https://site.api.espn.com/apis/site/v2/sports/${meta.sport}/${meta.league}/teams/${meta.id}/schedule?season=2026&seasontype=2`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status} for ${teamKey}`);
  const data = await res.json();
  const events = data?.events || [];

  // Hard safety net: never trust a fetched date outside the range our own
  // schedule data actually covers. ESPN's live endpoint has been observed
  // returning an entirely different season's games for some leagues/teams
  // (e.g. NHL) regardless of the season parameter requested — this rejects
  // that outright rather than trying to guess why it happened.
  const scheduleDates = games.map(g => g.date).filter(Boolean).sort();
  const minDate = scheduleDates[0];
  const maxDate = scheduleDates[scheduleDates.length - 1];

  events.forEach(ev => {
    const comp = ev.competitions?.[0];
    if (!comp) return;

    // Belt-and-suspenders: even with seasontype=2 requested, only trust an
    // event confirmed as regular season (type 2) when that field is present.
    // A missing field is not treated as a red flag — only an explicit
    // non-regular-season value skips the event.
    const seasonTypeVal = ev.season?.type ?? ev.seasonType?.type ?? ev.seasonType;
    if (seasonTypeVal != null && Number(seasonTypeVal) !== 2) return;

    // ESPN's date is UTC, which can land on the calendar day AFTER a late
    // local kickoff (e.g. an 8pm PT Saturday game is already Sunday in UTC).
    // A game's listed date must always be the day it STARTED, in this file's
    // zone — never a later day just because it ran past midnight there.
    const evDateInZone = ev.date ? eventDateInZone(ev.date, CALENDAR_TIMEZONE) : null;
    if (!evDateInZone || evDateInZone < minDate || evDateInZone > maxDate) return;
    let match = games.find(g => g.date === evDateInZone);

    const teamIdUpper = String(meta.id).toUpperCase();
    const own = comp.competitors?.find(c =>
      String(c.id) === String(meta.id) || (c.team?.abbreviation || "").toUpperCase() === teamIdUpper
    );
    const opp = comp.competitors?.find(c => c !== own);
    const oppName = opp?.team?.displayName || opp?.team?.location || opp?.team?.name;

    // Date-based match failed — most likely a flex-scheduled date/time change.
    // Fall back to matching by opponent identity among games not yet final.
    if (!match && oppName){
      match = games.find(g => g.status !== "final" && (oppName.includes(g.opp) || g.opp.includes(oppName)));
    }
    if (!match || match.status === "final") return;

    // Update home/away.
    if (own?.homeAway) match.home = (own.homeAway === "home");

    // Only touch TV/time/date when ESPN has actually assigned a broadcast —
    // otherwise leave everything as-is rather than risk overwriting a correct
    // manually-entered value (like "BTN"/"CBS") with a guess, or writing in a
    // placeholder kickoff time for a game that's genuinely still TBD.
    if (hasRealBroadcastInfo(comp)){
      if (evDateInZone && match.date !== evDateInZone) match.date = evDateInZone;
      const network = extractBroadcastName(comp);
      const timeStr = ev.date ? formatEventTime(ev.date, CALENDAR_TIMEZONE, ZONE_ABBR) : null;
      // If we can't pull a fresh network name even though broadcast info
      // exists, keep whatever network was already there rather than
      // defaulting to a generic "TV TBA" that could clobber a known value.
      const existingNetwork = parseGameTV(match.tv).network;
      const finalNetwork = network || (existingNetwork && !existingNetwork.toUpperCase().includes("TBA") ? existingNetwork : null);
      if (finalNetwork && timeStr) match.tv = `${finalNetwork} ${timeStr}`;
      else if (timeStr) match.tv = `TV TBA ${timeStr}`;
      else if (finalNetwork) match.tv = finalNetwork;
    }

    // Update score/status if the game is confirmed complete.
    const isFinal = comp.status?.type?.completed || comp.status?.type?.state === "post";
    if (!isFinal) return;
    const ownScore = extractEspnScore(own);
    const oppScore = extractEspnScore(opp);
    // Only commit to "final" once we actually have two real numbers — a
    // half-parsed score is worse than leaving the game as still "scheduled".
    if (ownScore == null || oppScore == null) return;
    match.status = "final";
    match.score = { team: ownScore, opp: oppScore };
  });
}

async function fetchAllLiveScores(){
  liveScoresFetchState = "loading";
  const results = await Promise.allSettled(
    Object.keys(TEAM_ESPN_META).map(k => fetchLiveScoresForTeam(k))
  );
  const anyFailed = results.some(r => r.status === "rejected");
  results.forEach(r => { if (r.status === "rejected") console.warn("Live score fetch failed:", r.reason); });
  liveScoresFetchState = anyFailed ? "failed" : "done";
  renderAll();
}


// Sortable value combining date + parsed kickoff time, so same-day games order correctly too.
function parseTimeMinutes(tvStr){
  const { time } = parseGameTV(tvStr);
  const m = (time || "").match(/(\d{1,2}):(\d{2})\s?(am|pm)/i);
  if (!m) return 24 * 60; // unknown time sorts after known times on the same day
  let hh = parseInt(m[1], 10);
  const mm = parseInt(m[2], 10);
  const ap = m[3].toLowerCase();
  if (ap === "pm" && hh !== 12) hh += 12;
  if (ap === "am" && hh === 12) hh = 0;
  return hh * 60 + mm;
}

function gameSortValue(game){
  const [y, m, d] = game.date.split("-").map(Number);
  return (y * 10000 + m * 100 + d) * 10000 + parseTimeMinutes(game.tv);
}

function teamSortValue(teamKey){
  const games = nextGames(teamKey, 1);
  return games.length ? gameSortValue(games[0]) : Infinity;
}

const DASHBOARD_COLUMNS = ["cfb","nfl","nhl","mlb"]; // left-to-right order
const OTHER_SPORTS_COLUMNS = ["mls","whl","nwsl"]; // left-to-right order, Other Sports tab

function dashboardCardHTML(sportKey, teamKey, team, game){

    </div>`;
}

function scheduleRowHTML(game, allGames, bold){
  const oppDisp = MASCOT_MAP[game.opp] || game.opp;
  const oppText = `${game.home ? "vs" : "@"} ${oppDisp}`;
  const dateText = fmtDate(game.date);

  // Two lines only when there's a second line worth showing (a final
  // score + record). An upcoming game has nothing to put there, so it
  // stays one line — date, time, and opponent sharing the full row width
  // naturally instead of fighting a fixed-width score column for space.
  let timeText, resultBlock = "";
  if (game.status === "final"){
    timeText = "Final";
    const win = game.score.team > game.score.opp;
    const resultColor = win ? "#2f7a2f" : "#a33";
    const scoreHtml = `<span style="color:${resultColor}">${game.score.team}-${game.score.opp} (${win ? "W" : "L"})</span>`;
    const recordText = allGames ? cumulativeRecordThrough(allGames, game) : "";
    resultBlock = `<div class="tsc-result">
      <span class="tsc-score">${scoreHtml}</span>
      <span class="tsc-record">${recordText}</span>
    </div>`;
  } else {
    const { time } = parseGameTV(game.tv);
    timeText = time || "TBA";
  }

  const rowClass = bold ? "tile-sched-row bold" : "tile-sched-row";
  return `<div class="${rowClass}">
    <div class="tsc-line1">
      <span class="tsc-date">${dateText}</span>
      <span class="tsc-time">${timeText}</span>
      <span class="tsc-opp">${oppText}</span>
    </div>
    ${resultBlock}
  </div>`;
}

function mostRecentFinalGame(teamKey){
  const games = (SCHEDULES[teamKey] || []).filter(g => g.status === "final");
  return games.length ? games[games.length - 1] : null;
}

// Full season, in order — every completed game shows its score (not bold),
// the very next upcoming game is bolded, everything after that is plain.
function fullScheduleCardBody(teamKey, games){
  const todayStr = todayISO();
  const nextGameRef = games.find(g => g.status === "scheduled" && g.date >= todayStr) || null;
  if (!games.length) return `<div class="tile-sched-row">No games loaded</div>`;
  return games.map(g => {
    if (g.status === "bye"){
      return `<div class="tile-sched-row bye"><span class="tsc-date">${fmtDate(g.date)}</span><span class="tsc-bye">Bye Week</span></div>`;
    }
    return scheduleRowHTML(g, games, g === nextGameRef);
  }).join("");
}

// NHL primary team: last 5 completed + next 5 upcoming, immediate next game bolded.
// NHL/MLB primary team: last 5 completed + next 5 upcoming, immediate next game bolded.
function last5Next5CardBody(teamKey, games){
  const finalGames = games.filter(g => g.status === "final");
  const upcoming = games.filter(g => g.status === "scheduled");
  const last5 = finalGames.slice(-5);
  const next5 = upcoming.slice(0, 5);
  const nextGameRef = next5[0] || null;
  if (!last5.length && !next5.length) return `<div class="tile-sched-row">No games loaded</div>`;
  let html = "";
  last5.forEach(g => { html += scheduleRowHTML(g, games, false); });
  next5.forEach(g => { html += scheduleRowHTML(g, games, g === nextGameRef); });
  return html;
}

// Secondary team, any sport: most recent result (not bold, matches how primary
// teams treat completed games) and the next game (bolded).
function secondaryCardBody(teamKey, games){
  const mostRecent = mostRecentFinalGame(teamKey);
  const next = nextGames(teamKey, 1)[0];
  let html = "";
  if (mostRecent) html += scheduleRowHTML(mostRecent, games, false);
  if (next) html += scheduleRowHTML(next, games, true);
  if (!mostRecent && !next) html += `<div class="tile-sched-row">No games loaded</div>`;
  return html;
}

function favoriteTeamCardHTML(sportKey, teamKey, team){
  const games = SCHEDULES[teamKey] || [];

// Most recent Sunday (today, if today is Sunday) through the following Sunday — 8 days inclusive.
function thisWeekRange(){
  const todayStr = todayISO();
  const [y, m, d] = todayStr.split("-").map(Number);
  const today = new Date(Date.UTC(y, m - 1, d));
  const dow = today.getUTCDay(); // 0 = Sunday
  const sunday = new Date(today);
  sunday.setUTCDate(today.getUTCDate() - dow);
  const days = [];
  for (let i = 0; i <= 7; i++){
    const dd = new Date(sunday);
    dd.setUTCDate(sunday.getUTCDate() + i);
    days.push(dd.toISOString().slice(0, 10));
  }
  return days;
}

function renderThisWeekSection(){
  const days = thisWeekRange();
  const todayStr = todayISO();
  const cells = days.map(dateStr => {
    const [y, m, d] = dateStr.split("-").map(Number);
    const dUTC = new Date(Date.UTC(y, m - 1, d));
    const dowLabel = dUTC.toLocaleDateString("en-US", { weekday:"short", timeZone:"UTC" });
    const entries = collectGamesForDate(dateStr);
    const isToday = dateStr === todayStr;
    return `<div class="cal-cell week-cell${isToday ? " is-today" : ""}">
      <div class="cal-dow" style="padding:0 0 4px;">${dowLabel}</div>
      <div class="cal-daynum">${d}</div>
      ${entries.map(calendarEntryHTML).join("")}
    </div>`;
  }).join("");

  return `
    <h2 class="section-title" style="font-size:20px; display:flex; align-items:center; gap:10px;">This Week
      <button class="week-toggle-btn" onclick="toggleWeekCollapse()">${state.weekCollapsed ? "Show" : "Hide"}</button>
    </h2>
    <div class="week-grid${state.weekCollapsed ? " collapsed" : ""}">${cells}</div>`;
}

const MLS_STANDINGS = {
  Western: ["Austin FC","Colorado Rapids","FC Dallas","Houston Dynamo FC","LA Galaxy","Los Angeles FC","Minnesota United FC","Portland Timbers","Real Salt Lake","San Diego FC","San Jose Earthquakes","Seattle Sounders FC","Sporting Kansas City","St. Louis City SC","Vancouver Whitecaps FC"],

};

let mlsStandingsFetchState = "idle"; // idle | loading | done | failed
let MLS_LIVE_RECORDS = {}; // team full name -> { w, l, d, pts }

async function fetchMLSStandings(forceRerender){
  mlsStandingsFetchState = "loading";
  try {
    const res = await fetch(ESPN_MLS_STANDINGS_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    let entries = data?.standings?.entries
      || data?.children?.[0]?.standings?.entries
      || (data?.children || []).flatMap(c => (c?.standings?.entries) || (c?.children || []).flatMap(cc => cc?.standings?.entries || []));
    if (!entries || !entries.length) throw new Error("Unexpected response shape from ESPN MLS standings API");

    const allTeamNames = Object.values(MLS_STANDINGS).flat();
    const namesByLength = [...allTeamNames].sort((a, b) => b.length - a.length);

    let matched = 0;
    entries.forEach(entry => {
      const displayName = entry?.team?.displayName || entry?.team?.location || entry?.team?.name;
      if (!displayName) return;
      const teamName = namesByLength.find(n => displayName.includes(n));
      if (!teamName) return;
      const stats = entry.stats || [];
      const w = findStatValue(stats, "wins", "w");
      const l = findStatValue(stats, "losses", "l");
      const d = findStatValue(stats, "ties", "draws", "d", "t");
      const pts = findStatValue(stats, "points", "pts");
      if (w == null || l == null) return;
      MLS_LIVE_RECORDS[teamName] = { w, l, d: d ?? "0", pts: pts ?? "—" };
      matched++;
    });
    if (matched === 0) throw new Error("Fetched MLS standings but couldn't match any team names");
    mlsStandingsFetchState = "done";
  } catch (err){
    mlsStandingsFetchState = "failed";
    console.warn("MLS standings live fetch failed — showing placeholder data instead.", err);
  }
  REFRESH_TIMES.mls = new Date();
  if (forceRerender) renderAll();
}
