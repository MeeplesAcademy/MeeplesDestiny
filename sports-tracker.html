<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rich's Sports Tracker</title>
<style>
  :root{
    --bg: #f5f6f4;
    --panel: #ffffff;
    --border: #d8dad4;
    --text: #1c1f1c;
    --text-mute: #5b5f58;
    --accent: #2b2f2a;

    --usc-1:#990000; --usc-2:#ffcc00;
    --uw-1:#4b2e83;  --uw-2:#b7a57a;
    --sea-1:#002244; --sea-2:#69be28; --sea-3:#a5acaf;
    --chi-1:#0b162a; --chi-2:#c83803;
    --den-1:#002244; --den-2:#fb4f14;
    --lak-1:#111111; --lak-2:#a2aaad;
    --skk-1:#355464; --skk-2:#99d9d9;
    --min-1:#154734; --min-2:#a6192e; --min-3:#eaaa00; --min-4:#ddcba4;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:Verdana, Geneva, sans-serif;
    font-size:13px;
    line-height:1.5;
  }

  header.site-head{
    padding:18px 28px 14px;
    border-bottom:1px solid var(--border);
    background:var(--panel);
  }
  header.site-head h1{
    margin:0;
    font-size:19px;
    letter-spacing:.2px;
    font-weight:bold;
  }
  header.site-head p{
    margin:4px 0 0;
    color:var(--text-mute);
    font-size:12px;
  }

  nav.primary{
    display:flex;
    gap:2px;
    padding:0 28px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:20;
  }
  nav.primary button{
    font-family:inherit;
    font-size:16px;
    font-weight:bold;
    background:none;
    border:none;
    padding:11px 16px;
    cursor:pointer;
    color:var(--text-mute);
    border-bottom:3px solid transparent;
    margin-bottom:-1px;
  }
  nav.primary button:hover{ color:var(--text); }
  nav.primary button.active{
    color:var(--text);
    border-bottom:3px solid var(--accent);
  }

  nav.secondary{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:14px 28px 0;
  }
  nav.secondary button{
    font-family:inherit;
    font-size:12px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:6px 13px;
    cursor:pointer;
    color:var(--text-mute);
  }
  nav.secondary button.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  nav.secondary button .dot{
    display:inline-block;
    width:8px;height:8px;
    border-radius:50%;
    margin-right:6px;
    vertical-align:middle;
    position:relative;
    top:-1px;
  }
  nav.secondary button .pill-logo{
    width:18px;
    height:18px;
    object-fit:contain;
    margin-right:6px;
    vertical-align:middle;
    position:relative;
    top:-1px;
  }

  main{ padding:20px 28px 60px; }
  main.dashboard-view{ max-width:1360px; margin:0 auto; }

  .note{
    font-size:11px;
    color:var(--text-mute);
    font-style:italic;
    margin:0 0 16px;
    padding:8px 12px;
    background:#fbf6e8;
    border:1px solid #ecdfb0;
    border-radius:4px;
  }
  .refresh-btn{
    font-family:inherit;
    font-style:normal;
    font-size:10px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:2px 9px;
    margin-left:6px;
    cursor:pointer;
    color:var(--text);
  }
  .refresh-btn:hover{ background:#f1f4ee; }
  .last-refreshed{
    font-size:11px;
    color:var(--text-mute);
    font-style:italic;
    margin:4px 0 8px;
  }
  .refresh-btn.refresh-btn-lg{
    font-size:13px;
    padding:6px 16px;
    border-radius:14px;
  }

  /* ---- Calendar tab ---- */
  .cal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
    padding:10px 4px;
    position:sticky;
    top:46px;
    background:var(--bg);
    z-index:5;
    border-bottom:1px solid var(--border);
  }
  .cal-header .refresh-btn.cal-nav-btn{
    font-size:14px;
    padding:8px 16px;
    margin-left:0;
  }
  .cal-month-label{
    font-size:18px;
    font-weight:bold;
  }
  .cal-month-section{
    margin-bottom:32px;
  }
  .cal-month-heading{
    font-size:16px;
    font-weight:bold;
    margin-bottom:10px;
    padding-bottom:6px;
    border-bottom:1px solid var(--border);
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:4px;
  }
  .cal-dow{
    font-size:13px;
    font-weight:bold;
    text-transform:uppercase;
    letter-spacing:.4px;
    color:var(--text-mute);
    text-align:center;
    padding:4px 0 8px;
  }
  .cal-cell{
    border:1px solid var(--border);
    border-radius:4px;
    min-height:88px;
    padding:6px;
    background:var(--panel);
  }
  .cal-cell.empty{
    border:none;
    background:transparent;
  }
  .cal-cell.is-today{
    border:3px solid var(--accent);
    padding:4px;
  }
  .cal-daynum{
    font-size:13px;
    color:var(--text-mute);
    margin-bottom:4px;
  }
  .cal-entry{
    border-left:3px solid var(--tc);
    background:color-mix(in srgb, var(--tc) 16%, var(--panel));
    border-radius:2px;
    padding:3px 6px;
    font-size:12px;
    line-height:1.35;
    margin-bottom:3px;
  }
  .cal-entry-team{ font-weight:bold; }
  .cal-entry-meta{
    display:block;
    color:var(--text-mute);
    font-size:11px;
    margin-top:1px;
  }
  @media (max-width:700px){
    .cal-grid{ grid-template-columns:repeat(7, minmax(36px, 1fr)); }
    .cal-entry{ font-size:9px; }
  }

  h2.section-title{
    font-size:14px;
    margin:22px 0 10px;
    padding-bottom:6px;
    border-bottom:1px solid var(--border);
  }
  h2.section-title:first-child{ margin-top:0; }
  h2.section-title.header-with-logo{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .col-heading.header-with-logo{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .header-logo{
    width:28px;
    height:28px;
    object-fit:contain;
    flex-shrink:0;
  }

  /* ---- Dashboard tiles ---- */
  .dash-columns{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:20px;
  }
  .dash-col h3{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.6px;
    color:var(--text-mute);
    margin:0 0 10px;
    padding-bottom:6px;
    border-bottom:1px solid var(--border);
  }
  .dash-col h3.dash-col-link{
    cursor:pointer;
  }
  .dash-col h3.dash-col-link:hover{
    color:var(--text);
    border-bottom-color:var(--accent);
  }
  .dash-col-tiles{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .dash-tile{
    background: color-mix(in srgb, var(--tc1) 12%, var(--panel));
    border:1px solid var(--border);
    border-top:4px solid var(--tc1);
    border-radius:4px;
    padding:12px 16px;
    cursor:pointer;
    min-height:82px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:6px;
  }
  .dash-tile:hover{
    background: color-mix(in srgb, var(--tc1) 20%, var(--panel));
    border-color:#b9bcb4;
  }
  .dash-tile .league-tag{
    font-size:10px;
    color:var(--text-mute);
    text-transform:uppercase;
    letter-spacing:.5px;
    white-space:nowrap;
  }
  .dash-tile .team-name{
    font-weight:bold;
    font-size:14px;
    margin:2px 0 8px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .tile-top{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:2px;
    min-width:0;
  }
  .tile-top .team-name{ margin:0; }
  .tile-top > div{ min-width:0; }
  .tile-record{
    margin-left:auto;
    flex-shrink:0;
    font-size:15px;
    font-weight:bold;
    color:var(--text);
  }
  .tile-logo{
    width:32px;
    height:32px;
    object-fit:contain;
    flex-shrink:0;
  }
  .dash-tile .next-game-label{
    font-size:10px;
    color:var(--text-mute);
    margin-bottom:2px;
  }
  .dash-tile .next-game{ font-size:12px; }
  .tile-game-bold{
    font-size:13px;
    font-weight:bold;
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .dash-tile.secondary{ opacity:.92; }

  @media (max-width:760px){
    .dash-columns{ grid-template-columns:1fr; }
  }

  /* ---- 3-column main pages (CFB overview) ---- */
  .main-3col{
    display:grid;
    grid-template-columns:1fr 1.1fr 1fr;
    gap:18px;
    align-items:start;
  }
  .main-3col.with-rankings{
    grid-template-columns:1fr 1.2fr 1.2fr;
  }
  .col-heading{
    font-size:16px;
    font-weight:bold;
    margin:0 0 10px;
    padding-bottom:6px;
    border-bottom:1px solid var(--border);
  }
  .col-heading.heading-with-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .col-heading.heading-with-btn .refresh-btn{
    margin-left:0;
    font-weight:normal;
  }
  .poll-tab-group{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .poll-tab-btn{
    font-family:inherit;
    font-size:13px;
    font-weight:bold;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:6px 14px;
    cursor:pointer;
    color:var(--text-mute);
  }
  .poll-tab-btn:hover{ color:var(--text); border-color:#b9bcb4; }
  .poll-tab-btn.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  @media (max-width:900px){
    .main-3col{ grid-template-columns:1fr; }
    .main-3col.with-rankings{ grid-template-columns:1fr; }
  }

  /* ---- Compact AP poll (narrow column on CFB main page) ---- */
  .poll-compact table.standings{ font-size:11px; }
  .poll-compact table.standings th,
  .poll-compact table.standings td{ padding:4px 5px; }
  .poll-compact .team-cell{
    display:block;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:100px;
  }

  /* ---- Schedule comparison (NFL) ---- */
  .compare-grid{
    display:grid;
    grid-template-columns:80px repeat(3, 1fr);
    gap:10px;
    align-items:stretch;
  }
  .compare-grid .cmp-head{
    font-size:19px;
    font-weight:bold;
    text-transform:none;
    letter-spacing:.2px;
    color:var(--text);
    padding:4px 0;
  }
  .compare-grid .cmp-head.header-with-logo{ gap:12px; }
  .compare-grid .cmp-head .header-logo{
    width:52px;
    height:52px;
  }
  .compare-grid .cmp-week{
    font-size:14px;
    font-weight:bold;
    color:var(--text);
    display:flex;
    align-items:center;
  }
  .cmp-cell{
    background:var(--panel);
    border:1px solid var(--border);
    border-left:4px solid var(--tc1);
    border-radius:4px;
    padding:10px 12px;
    font-size:15px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .cmp-cell.is-home{
    background: color-mix(in srgb, var(--tc1) 16%, var(--panel));
    border-left-color: var(--tc1);
  }
  .cmp-cell.is-away{
    background: var(--panel);
    border-left-color: var(--tc2, var(--tc1));
  }
  .cmp-cell-main{ min-width:0; }
  .cmp-cell .cmp-opp{ font-weight:bold; }
  .cmp-cell .cmp-meta{
    display:block;
    font-size:13px;
    color:var(--text-mute);
    margin-top:3px;
  }
  .cmp-cell-score{
    flex-shrink:0;
    text-align:right;
    font-size:14px;
  }
  .cmp-cell-record{
    font-size:13px;
    font-weight:bold;
    color:var(--text-mute);
    margin-top:2px;
  }
  .cmp-cell.bye{
    color:var(--text-mute);
    font-style:italic;
    border-left-color:#c9ccc4;
  }

  /* ---- Game cards ---- */
  .game-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .game-card{
    display:grid;
    grid-template-columns:90px 1fr 110px;
    align-items:center;
    gap:14px;
    background:var(--panel);
    border:1px solid var(--border);
    border-left:5px solid var(--tc1);
    border-radius:4px;
    padding:12px 16px;
    cursor:pointer;
  }
  .game-card:hover{ background:#fbfbf9; }
  /* Home games: shaded with the team's dark/primary color (jersey-at-home feel). */
  .game-card.is-home{
    background: color-mix(in srgb, var(--tc1) 16%, var(--panel));
    border-left-color: var(--tc1);
  }
  .game-card.is-home:hover{
    background: color-mix(in srgb, var(--tc1) 22%, var(--panel));
  }
  /* Away games: light/white background, colored trim from the team's secondary color. */
  .game-card.is-away{
    background: var(--panel);
    border-left-color: var(--tc2, var(--tc1));
  }
  .game-card.is-away:hover{
    background: color-mix(in srgb, var(--tc2, var(--tc1)) 8%, var(--panel));
  }
  .game-card .date{
    font-size:13px;
    font-weight:bold;
    color:var(--text);
  }
  .game-card-main{ min-width:0; }
  .game-card-opp{
    font-size:15px;
    font-weight:bold;
    line-height:1.3;
  }
  .game-card-tv{
    font-size:12px;
    color:var(--text-mute);
    margin-top:2px;
    line-height:1.3;
  }
  .game-card .score{
    font-size:15px;
    font-weight:bold;
    text-align:right;
  }
  .game-card .score .wl-tag{
    font-size:15px;
    font-weight:bold;
  }
  .game-card .score.scheduled{
    font-weight:normal;
    color:var(--text-mute);
    font-size:12px;
  }
  .game-card-record{
    font-size:14px;
    font-weight:bold;
    color:var(--text-mute);
    margin-top:2px;
  }

  @media (max-width:640px){
    .game-card{ grid-template-columns:1fr; text-align:left; }
    .game-card .score{ text-align:left; }
  }

  /* Individual team schedule pages: condensed left column, not full page width. */
  .schedule-narrow{
    max-width:540px;
  }

  /* ---- Month-grouped collapsible schedule (long seasons: NHL) ---- */
  .month-toolbar{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .month-toolbar .refresh-btn{
    font-size:12px;
    padding:5px 14px;
    margin-left:0;
  }
  .month-group{
    margin-bottom:10px;
  }
  .month-header{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:4px;
    padding:11px 14px;
    cursor:pointer;
    font-family:inherit;
    font-size:14px;
    font-weight:bold;
    text-align:left;
    color:var(--text);
  }
  .month-header:hover{
    background:#f1f4ee;
    border-color:#b9bcb4;
  }
  .month-chevron{
    display:inline-block;
    font-size:11px;
    color:var(--text-mute);
    transition:transform 0.15s ease;
    flex-shrink:0;
  }
  .month-header:not(.collapsed) .month-chevron{
    transform:rotate(90deg);
  }
  .month-title{ flex-shrink:0; }
  .month-record{
    margin-left:auto;
    font-weight:normal;
    font-size:12px;
    color:var(--text-mute);
    white-space:nowrap;
  }
  .month-body{
    margin-top:8px;
  }

  /* ---- Standings ---- */
  table.standings{
    width:100%;
    border-collapse:collapse;
    background:var(--panel);
    font-size:12px;
    margin-bottom:18px;
  }
  table.standings caption{
    text-align:left;
    font-weight:bold;
    font-size:12px;
    padding:8px 0 6px;
  }
  table.standings th{
    text-align:left;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.4px;
    color:var(--text-mute);
    border-bottom:1px solid var(--border);
    padding:6px 8px;
  }
  table.standings td{
    padding:6px 8px;
    border-bottom:1px solid #eceee9;
  }
  table.standings tr.my-team td{
    background: color-mix(in srgb, var(--rowc, #cfd4c8) 18%, var(--panel));
    font-weight:bold;
  }
  .standings-groups{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px,1fr));
    gap:0 24px;
  }
  .standings-2col{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
    align-items:start;
  }
  .standings-3col{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:24px;
    align-items:start;
  }
  @media (max-width:800px){
    .standings-2col{ grid-template-columns:1fr; }
  }
  @media (max-width:1100px){
    .standings-3col{ grid-template-columns:1fr 1fr; }
  }
  @media (max-width:700px){
    .standings-3col{ grid-template-columns:1fr; }
  }
  @media (max-width:900px){
    .standings-row{ grid-template-columns:repeat(2,1fr) !important; }
  }
  @media (max-width:560px){
    .standings-row{ grid-template-columns:1fr !important; }
  }
  .nfl-standings-wrap table.standings{
    font-size:14px;
  }
  .nfl-standings-wrap table.standings caption{
    font-size:15px;
    padding:10px 0 8px;
  }
  .nfl-standings-wrap table.standings th{
    font-size:12px;
    padding:8px 10px;
  }
  .nfl-standings-wrap table.standings td{
    padding:8px 10px;
  }
</style>
</head>
<body>

<header class="site-head">
  <h1>Rich's Sports Tracker</h1>
  <p>Dashboard for USC, UW, Seahawks, Bears, Broncos, Kings &amp; Kraken</p>
</header>

<nav class="primary" id="primaryNav"></nav>
<nav class="secondary" id="secondaryNav"></nav>

<main id="content"></main>

<script>
/* =========================================================
   DATA — replace/expand this section with real schedules,
   standings, and scores. Structure is what matters for now.

   Styling note: game cards and schedule-comparison cells are
   shaded per team — dark/primary color for Home games, light
   background with colored trim (secondary color) for Away
   games. Colors live in the :root CSS vars above (--usc-1/2,
   --sea-1/2, etc.) and are passed per-card as --tc1/--tc2.

function fmtDate(iso){
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-US", { weekday:"short", month:"short", day:"numeric" });
}

function goToSport(sportKey){
  state.primary = sportKey;
  state.secondary = (sportKey === "dashboard" || sportKey === "calendar") ? null :
    (sportKey === "cfb" || sportKey === "nfl") ? "main" :
    (TEAMS[sportKey] ? TEAMS[sportKey].order[0] : null);
  if (sportKey === "calendar"){
    const idx = currentSeasonMonthIndex();
    const [y, m] = SEASON_MONTHS[idx];
    state.calYear = y;
    state.calMonth = m;
    state.calendarJumpPending = true;
  }
  renderAll();
}

function renderPrimaryNav(){
  const nav = document.getElementById("primaryNav");
  nav.innerHTML = "";
  PRIMARY_TABS.forEach(t => {
    const btn = document.createElement("button");
    btn.textContent = t.label;
    if (state.primary === t.key) btn.classList.add("active");
    btn.onclick = () => goToSport(t.key);
    nav.appendChild(btn);
  });
}

function renderSecondaryNav(){
  const nav = document.getElementById("secondaryNav");
  nav.innerHTML = "";
  if (state.primary === "dashboard" || state.primary === "calendar") return;

  const sport = TEAMS[state.primary];

  const makeStandingsBtn = () => {
    const standingsBtn = document.createElement("button");
    standingsBtn.textContent = "Standings";
    if (state.secondary === "standings") standingsBtn.classList.add("active");
    standingsBtn.onclick = () => { state.secondary = "standings"; renderAll(); };
    return standingsBtn;
  };

  if (state.primary === "cfb" || state.primary === "nfl"){
    const mainBtn = document.createElement("button");
    mainBtn.textContent = "Main";
    if (state.secondary === "main") mainBtn.classList.add("active");
    mainBtn.onclick = () => { state.secondary = "main"; renderAll(); };
    nav.appendChild(mainBtn);
  }

  if (state.primary === "nfl") nav.appendChild(makeStandingsBtn());

  sport.order.forEach(key => {
    const t = sport.teams[key];
    const btn = document.createElement("button");
    btn.innerHTML = LOGOS[key]
      ? `<img class="pill-logo" src="${LOGOS[key]}" alt="">${t.name}`
      : `<span class="dot" style="background:${t.c1}"></span>${t.name}`;
    if (state.secondary === key) btn.classList.add("active");
    btn.onclick = () => { state.secondary = key; renderAll(); };
    nav.appendChild(btn);
  });

  if (state.primary !== "nfl") nav.appendChild(makeStandingsBtn());
}

function cumulativeRecordThrough(games, game){
  let w = 0, l = 0, t = 0;
  for (const gm of games){
    if (gm.status === "final"){
      if (gm.score.team > gm.score.opp) w++;
      else if (gm.score.team < gm.score.opp) l++;
      else t++;
    }
    if (gm === game) break;
  }
  return t > 0 ? `${w}-${l}-${t}` : `${w}-${l}`;
}

function gameCardHTML(g, team, allGames){
  if (g.status === "bye"){
    return `
      <div class="game-card" style="--tc1:#c9ccc4; opacity:.65; cursor:default;">
        <div class="date">${fmtDate(g.date)}</div>
        <div class="game-card-main">
          <div class="game-card-opp">Bye Week</div>
        </div>
        <div class="score scheduled">—</div>
      </div>`;
  }
  let scoreHTML;
  if (g.status === "final"){
    const win = g.score.team > g.score.opp;
    const record = allGames ? cumulativeRecordThrough(allGames, g) : "";
    scoreHTML = `<div class="score">
      <div>${g.score.team}-${g.score.opp} <span class="wl-tag" style="color:${win ? '#2f7a2f' : '#a33'}">${win ? "W" : "L"}</span></div>
      ${record ? `<div class="game-card-record">${record}</div>` : ""}
    </div>`;
  } else {
    scoreHTML = `<div class="score scheduled">Scheduled</div>`;
  }
  const homeAwayClass = g.home ? "is-home" : "is-away";
  return `
    <div class="game-card ${homeAwayClass}" style="--tc1:${team.c1}; --tc2:${team.c2}">
      <div class="date">${fmtDate(g.date)}</div>
      <div class="game-card-main">
        <div class="game-card-opp">${g.home ? "vs" : "@"} ${g.opp}</div>
        <div class="game-card-tv">${g.tv || "TV TBD"} · ${g.home ? "Home" : "Away"}</div>
      </div>
      ${scoreHTML}
    </div>`;
}

// Teams with long enough seasons that a flat list gets unwieldy — grouped by
// month with collapsible sections instead of one continuous scroll.
const LONG_SEASON_TEAMS = ["lak", "skk"];

const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

// Collapse state persists across re-renders (e.g. a live-score refresh)
// rather than resetting whenever the page redraws. Keyed per team+month so
// each team's toggle state is independent.
let MONTH_COLLAPSE_STATE = {};

function monthStateKey(teamKey, year, month){ return `${teamKey}:${year}-${month}`; }

function groupGamesByMonth(games){
  const groups = [];
  let current = null;
  games.forEach(g => {
    const [y, m] = g.date.split("-").map(Number);
    if (!current || current.year !== y || current.month !== m){
      current = { year:y, month:m, games:[] };
      groups.push(current);
    }
    current.games.push(g);
  });
  return groups;
}

function recordFor(games){
  let w = 0, l = 0;
  games.forEach(g => {
    if (g.status === "final"){
      if (g.score.team > g.score.opp) w++;
      else if (g.score.team < g.score.opp) l++;
    }
  });
  return { w, l };
}

function toggleMonth(key){
  MONTH_COLLAPSE_STATE[key] = !MONTH_COLLAPSE_STATE[key];
  renderAll();
}

function setAllMonths(teamKey, collapsed){
  Object.keys(MONTH_COLLAPSE_STATE).forEach(k => {
    if (k.startsWith(teamKey + ":")) MONTH_COLLAPSE_STATE[k] = collapsed;
  });
  renderAll();
}

function renderMonthGroupedSchedule(teamKey, team, games){
  const groups = groupGamesByMonth(games);
  let cumW = 0, cumL = 0;
  const sections = groups.map(grp => {
    const { w, l } = recordFor(grp.games);
    cumW += w; cumL += l;
    const allFinal = grp.games.every(g => g.status === "final");
    const key = monthStateKey(teamKey, grp.year, grp.month);
    // Default collapsed only the first time we ever see this month, and only
    // if every game in it is already final — future visits respect whatever
    // the user last set, even after a live-score re-render.
    if (!(key in MONTH_COLLAPSE_STATE)) MONTH_COLLAPSE_STATE[key] = allFinal;
    const collapsed = MONTH_COLLAPSE_STATE[key];
    const monthLabel = `${MONTH_NAMES[grp.month - 1]} ${grp.year}`;
    let recordLabel = "";
    if (allFinal) recordLabel = `${w}-${l}, ${cumW}-${cumL} overall`;
    else if (w + l > 0) recordLabel = `${w}-${l} so far, ${cumW}-${cumL} overall`;
    return `
      <div class="month-group">
        <button class="month-header ${collapsed ? "collapsed" : ""}" onclick="toggleMonth('${key}')">
          <span class="month-chevron">▶</span>
          <span class="month-title">${monthLabel}</span>
          ${recordLabel ? `<span class="month-record">${recordLabel}</span>` : ""}
        </button>
        <div class="month-body" style="display:${collapsed ? "none" : "block"}">
          <div class="game-list">
            ${grp.games.map(g => gameCardHTML(g, team, games)).join("")}
          </div>
        </div>
      </div>`;
  }).join("");
  return `
    <div class="month-toolbar">
      <button class="refresh-btn" onclick="setAllMonths('${teamKey}', false)">Expand All</button>
      <button class="refresh-btn" onclick="setAllMonths('${teamKey}', true)">Collapse All</button>
    </div>
    ${sections}`;
}

function renderTeamSchedule(sportKey, teamKey){
  const team = TEAMS[sportKey].teams[teamKey];

}

// Row-highlight colors picked for the Dashboard cards, reused here for Standings.
// Live NFL standings — same defensive pattern as the Big Ten/MLB fetches:
// hit ESPN's public standings endpoint, match by team name, fail gracefully.
const ESPN_NFL_STANDINGS_URL = "https://site.api.espn.com/apis/v2/sports/football/nfl/standings?type=0&level=3";
let nflStandingsFetchState = "idle"; // idle | loading | done | failed
let NFL_LIVE_RECORDS = {}; // team full name -> { w, l, t, pct, pf, pa }

// ESPN's displayName doesn't always match our shorthand — "LA Rams" vs
// "Los Angeles Rams", etc. — so check known aliases before giving up on a team.
const NFL_STANDINGS_ALIASES = {
  "LA Rams": ["LA Rams", "Los Angeles Rams"],
  "LA Chargers": ["LA Chargers", "Los Angeles Chargers"]
};

function findStatValue(stats, ...names){
  const stat = stats.find(s => names.some(n => (s.name || "").toLowerCase() === n.toLowerCase()
    || (s.abbreviation || "").toLowerCase() === n.toLowerCase()));
  return stat ? (stat.displayValue ?? stat.value) : null;
}

// Tracks when each Refresh button was last actually clicked (regardless of
// success/failure), so the person can tell the click registered even if
// nothing visibly changed on screen.
let REFRESH_TIMES = {};
function refreshTimeLabel(key){
  if (!REFRESH_TIMES[key]) return "";
  return `Last refreshed ${REFRESH_TIMES[key].toLocaleTimeString()}`;
}

async function fetchNFLStandings(forceRerender){
  nflStandingsFetchState = "loading";
  try {
    const res = await fetch(ESPN_NFL_STANDINGS_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    let entries = data?.standings?.entries
      || data?.children?.[0]?.standings?.entries
      || (data?.children || []).flatMap(c => (c?.standings?.entries) || (c?.children || []).flatMap(cc => cc?.standings?.entries || []));
    if (!entries || !entries.length) throw new Error("Unexpected response shape from ESPN NFL standings API");

    const allTeamNames = NFL_CONF_ORDER.flatMap(conf => NFL_DIV_ORDER.flatMap(div => NFL_STANDINGS[conf][div]));
    const namesByLength = [...allTeamNames].sort((a, b) => b.length - a.length);

    let matched = 0;
    entries.forEach(entry => {
      const displayName = entry?.team?.displayName || entry?.team?.location || entry?.team?.name;
      if (!displayName) return;
      const teamName = namesByLength.find(n => {
        const aliases = NFL_STANDINGS_ALIASES[n] || [n];
        return aliases.some(a => displayName.includes(a));
      });
      if (!teamName) return;
      const stats = entry.stats || [];
      const w = findStatValue(stats, "wins");
      const l = findStatValue(stats, "losses");
      const t = findStatValue(stats, "ties");
      const pct = findStatValue(stats, "winpercent", "pct");
      const pf = findStatValue(stats, "pointsfor", "pf");
      const pa = findStatValue(stats, "pointsagainst", "pa");
      if (w == null || l == null) return;
      NFL_LIVE_RECORDS[teamName] = { w, l, t: t ?? "0", pct: pct ?? "—", pf: pf ?? "—", pa: pa ?? "—" };
      matched++;
    });
    if (matched === 0) throw new Error("Fetched NFL standings but couldn't match any team names");
    nflStandingsFetchState = "done";
  } catch (err){
    nflStandingsFetchState = "failed";
    console.warn("NFL standings live fetch failed — showing placeholder data instead.", err);
  }
  REFRESH_TIMES.nfl = new Date();
  if (forceRerender) renderAll();
}

function nflStandingsStatusNote(){
  if (nflStandingsFetchState === "loading") return "Fetching live standings from ESPN…";
  if (nflStandingsFetchState === "done") return "Live data loaded from ESPN just now.";
  if (nflStandingsFetchState === "failed") return "Live fetch didn't come back with usable data — showing placeholders below instead.";
  return "";
}

  const l = live ? live.l : "—";
  const t = live ? live.t : "—";
  const pct = live ? live.pct : "—";

  return `<tr class="${shaded ? "my-team" : ""}"${styleAttr}>

// Sort a division's teams by actual live record (wins desc, then losses asc)
// so standings reflect who's actually leading, not a fixed alphabetical list.
// Teams with no live data yet sink to the bottom rather than distorting order.
function sortNFLDivision(teamNames){
  return [...teamNames].sort((a, b) => {
    const ra = NFL_LIVE_RECORDS[a], rb = NFL_LIVE_RECORDS[b];
    if (!ra && !rb) return 0;
    if (!ra) return 1;
    if (!rb) return -1;
    const wa = parseInt(ra.w, 10) || 0, wb = parseInt(rb.w, 10) || 0;
    if (wb !== wa) return wb - wa;
    const la = parseInt(ra.l, 10) || 0, lb = parseInt(rb.l, 10) || 0;
    return la - lb;
  });
}

/* =========================================================
   LIVE STANDINGS FETCH — ESPN's public, unauthenticated JSON
   API (used directly from browser JS by many independent
   projects, no key/proxy needed). Wrapped defensively: any
   failure (CORS, network, shape change) just leaves the
   existing table alone rather than breaking the page.
========================================================= */
const ESPN_BIGTEN_STANDINGS_URL = "https://site.api.espn.com/apis/v2/sports/football/college-football/standings?group=5";
let bigTenFetchState = "idle"; // idle | loading | done | failed

// Longest names first so "Michigan State" matches before "Michigan".
const BIG_TEN_NAMES_BY_LENGTH = [...BIG_TEN.map(r => r.team)].sort((a, b) => b.length - a.length);

function matchBigTenTeam(espnDisplayName){
  if (!espnDisplayName) return null;
  return BIG_TEN_NAMES_BY_LENGTH.find(name => espnDisplayName.includes(name)) || null;
}

function parseRecordPair(str){
  const m = /(-?\d+)\D+(-?\d+)/.exec(str || "");
  return m ? { w: parseInt(m[1], 10), l: parseInt(m[2], 10) } : null;
}

async function fetchBigTenStandings(forceRerender){
  bigTenFetchState = "loading";
  try {
    const res = await fetch(ESPN_BIGTEN_STANDINGS_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    // ESPN's standings JSON has shown up under a couple of different shapes
    // over the years — try the plausible paths rather than assuming one.
    let entries = data?.standings?.entries
      || data?.children?.[0]?.standings?.entries
      || (data?.children || []).flatMap(c => c?.standings?.entries || []);
    if (!entries || !entries.length) throw new Error("Unexpected response shape from ESPN standings API");

    let matched = 0;
    entries.forEach(entry => {
      const displayName = entry?.team?.displayName || entry?.team?.name || entry?.team?.shortDisplayName;
      const teamKey = matchBigTenTeam(displayName);
      if (!teamKey) return;
      const row = BIG_TEN.find(r => r.team === teamKey);
      if (!row) return;

      const stats = entry.stats || [];
      const overallStat = stats.find(s => /^overall$/i.test(s.name) || /^total$/i.test(s.type));
      const confStat = stats.find(s => /conf/i.test(s.name) || /vsconf/i.test(s.type));
      const streakStat = stats.find(s => /streak/i.test(s.name));

      const overall = parseRecordPair(overallStat?.displayValue || overallStat?.summary);
      const conf = parseRecordPair(confStat?.displayValue || confStat?.summary);

      if (overall){ row.ovrW = overall.w; row.ovrL = overall.l; row.known = true; matched++; }
      if (conf){ row.confW = conf.w; row.confL = conf.l; }
      if (streakStat?.displayValue) row.streak = streakStat.displayValue;
    });

    if (matched === 0) throw new Error("Fetched standings but couldn't match any team names");
    bigTenFetchState = "done";
  } catch (err){
    bigTenFetchState = "failed";
    console.warn("Big Ten live standings fetch failed — showing last-known data instead.", err);
  }
  REFRESH_TIMES.bigten = new Date();
  if (forceRerender) renderAll();
}

function bigTenFetchStatusNote(){
  if (bigTenFetchState === "loading") return "Fetching live standings from ESPN…";
  if (bigTenFetchState === "done") return "Live data loaded from ESPN just now.";
  if (bigTenFetchState === "failed") return "Live fetch didn't come back with usable data (could be CORS, a network hiccup, or ESPN changing their response shape) — showing the last-known data below instead.";
  return "";
}

/* ---- AP Top 25 — same live-fetch-with-fallback pattern as Big Ten standings ---- */
const ESPN_RANKINGS_URL = "https://site.api.espn.com/apis/site/v2/sports/football/college-football/rankings";
let apPollFetchState = "idle"; // idle | loading | done | failed

const AP_POLL_ALIASES = {
  "BYU": ["BYU", "Brigham Young"],
  "Ole Miss": ["Ole Miss", "Mississippi Rebels", "Mississippi"],
  "Texas A&M": ["Texas A&M"],
  "SMU": ["SMU", "Southern Methodist"]
};
const AP_POLL_NAMES_BY_LENGTH = [...AP_POLL].sort((a, b) => b.team.length - a.team.length);

// ESPN's team object shape varies by response — sometimes displayName is the full
// "School Mascot" combo, sometimes it's mascot-only and the school name only shows
// up in location/name/shortDisplayName. Check every candidate field rather than
// assuming one; a match failure here used to fail silently (stale data) or, worse,
// get treated as a brand-new team and overwrite the correct school name with a
// mascot-only one.
function apTeamCandidates(team){
  if (!team) return [];
  return [team.location, team.displayName, team.name, team.shortDisplayName].filter(Boolean);
}

function matchApTeam(team){
  const candidates = apTeamCandidates(team);
  if (!candidates.length) return null;
  for (const row of AP_POLL_NAMES_BY_LENGTH){
    const aliases = AP_POLL_ALIASES[row.team] || [row.team];
    if (aliases.some(a => candidates.some(c => c.includes(a)))) return row;
  }
  return null;
}

// College Football Playoff committee rankings — same ESPN endpoint/response as the AP
// poll, just a different poll source within it. Empty until the CFP committee starts
// publishing (usually early-to-mid November); this just needs to sit here ready.
let CFP_POLL = [];

async function fetchApPoll(forceRerender){
  apPollFetchState = "loading";
  try {
    const res = await fetch(ESPN_RANKINGS_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    const polls = data?.rankings || [];
    const apPoll = polls.find(p => /^ap top/i.test(p.name || p.shortName || "")) || polls[0];
    const ranks = apPoll?.ranks;
    if (!ranks || !ranks.length) throw new Error("Unexpected response shape from ESPN rankings API");

    // Validate the shape fully before touching AP_POLL at all — a malformed
    // response (e.g. every rank undefined) must never be allowed to wipe out
    // the existing list.
    const ranksLookValid = ranks.every(r => Number.isInteger(r.current));
    if (!ranksLookValid) throw new Error("Rankings entries missing a usable rank number");

    let matched = 0;
    const newlyAdded = [];
    const touched = new Set();
    ranks.forEach(r => {
      let target = matchApTeam(r.team);
      // A team that wasn't in the preseason 25 but has since climbed into the
      // rankings has no existing row to match — add one rather than drop it.
      // Prefer "location" (usually just the school name) over the full
      // displayName so a genuinely new entry still reads as a school name
      // rather than a mascot where possible.
      if (!target){
        const bestName = r.team?.location || r.team?.displayName || r.team?.name || r.team?.shortDisplayName;
        if (bestName){
          target = { rank: r.current, team: bestName, votes:0, record:"0-0", points:0, trend:"NR" };
          newlyAdded.push(target);
        }
      }
      // Deliberately never overwrite an existing target.team — we keep the school name
      // (e.g. "USC") rather than whatever mascot-only name ESPN returns.
      if (target){
        target.rank = r.current ?? target.rank;
        target.votes = r.firstPlaceVotes || 0;
        target.record = r.recordSummary || target.record;
        target.points = r.points ?? target.points;
        target.trend = r.trend || target.trend;
        touched.add(target);
        matched++;
      }
    });
    if (matched === 0) throw new Error("Fetched poll but couldn't match any team names");

    // Only now that we know the fetch was genuinely usable do we mutate the list:
    // add newly-ranked teams, then drop anyone this fetch didn't actually touch
    // (tracked by object identity, not rank number — a rank slot can change hands
    // to a different team entirely, so the old occupant must not survive on a
    // number-only check).
    newlyAdded.forEach(t => { AP_POLL.push(t); AP_POLL_NAMES_BY_LENGTH.push(t); });
    for (let i = AP_POLL.length - 1; i >= 0; i--){
      if (!touched.has(AP_POLL[i])) AP_POLL.splice(i, 1);
    }
    AP_POLL.sort((a, b) => a.rank - b.rank);

    // Same response, different poll source — grab CFP committee rankings if present.
    const cfpPoll = polls.find(p => /college football playoff/i.test(p.name || p.shortName || "") || p.type === "cfp");
    if (cfpPoll?.ranks?.length){
      CFP_POLL = cfpPoll.ranks.map(r => ({
        rank: r.current,
        team: r.team?.location || r.team?.displayName || r.team?.name || "Unknown",
        record: r.recordSummary || "0-0",
        trend: r.trend || "NR"
      }));
    }

    apPollFetchState = "done";
  } catch (err){
    apPollFetchState = "failed";
    console.warn("AP poll live fetch failed — showing last-known data instead.", err);
  }
  REFRESH_TIMES.appoll = new Date();
  if (forceRerender) renderAll();
}

function apPollStatusNote(){
  if (apPollFetchState === "loading") return "Fetching live poll from ESPN…";
  if (apPollFetchState === "done") return "Live poll loaded from ESPN just now.";
  if (apPollFetchState === "failed") return "Live fetch didn't return usable data — showing the preseason poll below instead.";
  return "Showing the preseason poll until Week 1 rankings post.";

// Local (not UTC) YYYY-MM-DD for "today" — avoids an early-morning PT vs UTC date mismatch.
// Every "today" check in this file — upcoming-game filtering, past-game
// formatting, the calendar's default month, all of it — uses this fixed
// zone (Pacific for this file) rather than the viewer's own browser
// timezone, since every date/time on the page is labeled in that zone.
const CALENDAR_TIMEZONE = "America/Los_Angeles";
function todayISOInZone(timeZone){
  const parts = new Intl.DateTimeFormat("en-US", { timeZone, year:"numeric", month:"2-digit", day:"2-digit" }).formatToParts(new Date());
  const y = parts.find(p => p.type === "year").value;
  const m = parts.find(p => p.type === "month").value;
  const d = parts.find(p => p.type === "day").value;
  return `${y}-${m}-${d}`;
}

function todayISO(){
  return todayISOInZone(CALENDAR_TIMEZONE);
}

function nextGames(teamKey, count){
  const today = todayISO();
  const games = (SCHEDULES[teamKey] || []).filter(g => g.status === "scheduled" && g.date >= today);
  return games.slice(0, count);
}

/* =========================================================
   LIVE SCORES — same pattern as standings/rankings: fetch
   ESPN's public team-schedule API, update SCHEDULES in place
   when a game is confirmed final, fail silently otherwise.
   Runs once on load; every view that reads SCHEDULES (game
   cards, Calendar, NFL comparison grid) picks up the update
   automatically on the next render.
========================================================= */
const TEAM_ESPN_META = {
  sea: { sport:"football", league:"nfl", id:"sea" },
  chi: { sport:"football", league:"nfl", id:"chi" },
  den: { sport:"football", league:"nfl", id:"den" },
  lak: { sport:"hockey", league:"nhl", id:"la" },
  skk: { sport:"hockey", league:"nhl", id:"sea" },
  min: { sport:"hockey", league:"nhl", id:"min" },
  usc: { sport:"football", league:"college-football", id:"30" },
  uw: { sport:"football", league:"college-football", id:"264" }
};

let liveScoresFetchState = "idle"; // idle | loading | done | failed

// ESPN's score field shows up as either a plain string/number or an
// {value, displayValue} object depending on which endpoint/era — handle both
// rather than assume one, and never trust a value that doesn't parse cleanly.
function extractEspnScore(competitor){
  if (!competitor) return null;
  const raw = (typeof competitor.score === "object" && competitor.score !== null)
    ? (competitor.score.value ?? competitor.score.displayValue)
    : competitor.score;
  if (raw == null) return null;
  const n = parseInt(raw, 10);
  return Number.isFinite(n) ? n : null;
}

async function fetchLiveScoresForTeam(teamKey){
  const meta = TEAM_ESPN_META[teamKey];
  const games = SCHEDULES[teamKey];
  if (!meta || !games) return;
  const url = `https://site.api.espn.com/apis/site/v2/sports/${meta.sport}/${meta.league}/teams/${meta.id}/schedule?season=2026`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status} for ${teamKey}`);
  const data = await res.json();
  const events = data?.events || [];

  events.forEach(ev => {
    const comp = ev.competitions?.[0];
    if (!comp) return;
    const isFinal = comp.status?.type?.completed || comp.status?.type?.state === "post";
    if (!isFinal) return;

    const evDate = (ev.date || "").slice(0, 10);
    // ESPN dates are UTC — a late PT kickoff can land on the next UTC calendar day,
    // so try the exact date first, then one day earlier, before giving up.
    let match = games.find(g => g.date === evDate);
    if (!match){
      const d = new Date(evDate + "T00:00:00Z");
      d.setUTCDate(d.getUTCDate() - 1);
      const prevDay = d.toISOString().slice(0, 10);
      match = games.find(g => g.date === prevDay);
    }
    if (!match || match.status === "final") return;

    const teamIdUpper = String(meta.id).toUpperCase();
    const own = comp.competitors?.find(c =>
      String(c.id) === String(meta.id) || (c.team?.abbreviation || "").toUpperCase() === teamIdUpper
    );
    const opp = comp.competitors?.find(c => c !== own);
    const ownScore = extractEspnScore(own);
    const oppScore = extractEspnScore(opp);
    // Only commit to "final" once we actually have two real numbers — a
    // half-parsed score is worse than leaving the game as still "scheduled".
    if (ownScore == null || oppScore == null) return;

    match.status = "final";
    match.score = { team: ownScore, opp: oppScore };
  });
}

async function fetchAllLiveScores(){
  liveScoresFetchState = "loading";
  const results = await Promise.allSettled(
    Object.keys(TEAM_ESPN_META).map(k => fetchLiveScoresForTeam(k))
  );
  const anyFailed = results.some(r => r.status === "rejected");
  results.forEach(r => { if (r.status === "rejected") console.warn("Live score fetch failed:", r.reason); });
  liveScoresFetchState = anyFailed ? "failed" : "done";
  renderAll();
}


// Sortable value combining date + parsed kickoff time, so same-day games order correctly too.
function parseTimeMinutes(tvStr){
  const { time } = parseGameTV(tvStr);
  const m = (time || "").match(/(\d{1,2}):(\d{2})\s?(am|pm)/i);
  if (!m) return 24 * 60; // unknown time sorts after known times on the same day
  let hh = parseInt(m[1], 10);
  const mm = parseInt(m[2], 10);
  const ap = m[3].toLowerCase();
  if (ap === "pm" && hh !== 12) hh += 12;
  if (ap === "am" && hh === 12) hh = 0;
  return hh * 60 + mm;
}

function gameSortValue(game){
  const [y, m, d] = game.date.split("-").map(Number);
  return (y * 10000 + m * 100 + d) * 10000 + parseTimeMinutes(game.tv);
}

function teamSortValue(teamKey){
  const games = nextGames(teamKey, 1);
  return games.length ? gameSortValue(games[0]) : Infinity;
}

const DASHBOARD_COLUMNS = ["cfb","nfl","nhl"]; // left-to-right order requested

function dashboardCardHTML(sportKey, teamKey, team, game){
  const { time } = parseGameTV(game.tv);
  const oppDisp = MASCOT_MAP[game.opp] || game.opp;
  const logo = LOGOS[teamKey] ? `<img class="tile-logo" src="${LOGOS[teamKey]}" alt="${team.name} logo">` : "";
  const tileColor = team.dashColor || team.c1;
  return `
    <div class="dash-tile ${team.tier}" style="--tc1:${tileColor}" onclick="goToTeam('${sportKey}','${teamKey}')">
      <div class="tile-top">
        ${logo}
        <div>
          <div class="league-tag">${TEAMS[sportKey].label} · ${team.tier}</div>
          <div class="team-name">${team.name}</div>
        </div>
      </div>
      <div class="tile-game-bold">${fmtDate(game.date)} — ${game.home ? "vs" : "@"} ${oppDisp}${time ? ` · ${time}` : ""}</div>
    </div>`;
}

function mostRecentFinalGame(teamKey){
  const games = (SCHEDULES[teamKey] || []).filter(g => g.status === "final");
  return games.length ? games[games.length - 1] : null;
}

function primaryTeamRecordLabel(sportKey, teamKey, team){
  if (sportKey === "cfb"){
    const row = BIG_TEN.find(r => r.team === DISPLAY_NAME[teamKey]);
    return (row && row.known) ? `${row.ovrW}-${row.ovrL}` : "";
  }
  if (sportKey === "nfl"){
    const rec = NFL_LIVE_RECORDS[team.name];
    if (!rec) return "";
    return (rec.t && rec.t !== "0") ? `${rec.w}-${rec.l}-${rec.t}` : `${rec.w}-${rec.l}`;
  }
  if (sportKey === "nhl"){
    const rec = NHL_LIVE_RECORDS[team.name];
    return rec ? `${rec.w}-${rec.l}-${rec.ot}` : "";
  }
  return "";
}

function dashboardRecentCardHTML(sportKey, teamKey, team, game){
  const oppDisp = MASCOT_MAP[game.opp] || game.opp;
  const logo = LOGOS[teamKey] ? `<img class="tile-logo" src="${LOGOS[teamKey]}" alt="${team.name} logo">` : "";
  const tileColor = team.dashColor || team.c1;
  const win = game.score.team > game.score.opp;
  const resultColor = win ? "#2f7a2f" : "#a33";
  const recordLabel = cumulativeRecordThrough(SCHEDULES[teamKey] || [], game);
  return `
    <div class="dash-tile ${team.tier}" style="--tc1:${tileColor}" onclick="goToTeam('${sportKey}','${teamKey}')">
      <div class="tile-top">
        ${logo}
        <div>
          <div class="league-tag">${TEAMS[sportKey].label} · ${team.tier}</div>
          <div class="team-name">${team.name}</div>
        </div>
        ${recordLabel ? `<div class="tile-record">${recordLabel}</div>` : ""}
      </div>
      <div class="tile-game-bold">${fmtDate(game.date)} — ${game.home ? "vs" : "@"} ${oppDisp} · ${game.home ? "Home" : "Away"} · <span style="color:${resultColor}">${game.score.team}-${game.score.opp} (${win ? "W" : "L"})</span></div>
    </div>`;
}

function renderDashboard(){
  let html = `<h2 class="section-title" style="font-size:20px;">Most Recent Games</h2><div class="dash-columns">`;
  DASHBOARD_COLUMNS.forEach(sportKey => {
    const sport = TEAMS[sportKey];
    const primaryKey = sport.order[0];
    const team = sport.teams[primaryKey];
    const game = mostRecentFinalGame(primaryKey);

    html += `<div class="dash-col"><h3 class="dash-col-link" onclick="goToSport('${sportKey}')">${sport.label}</h3><div class="dash-col-tiles">`;
    if (game){
      html += dashboardRecentCardHTML(sportKey, primaryKey, team, game);
    } else if (liveScoresFetchState === "idle" || liveScoresFetchState === "loading"){
      html += `<div class="dash-tile"><div class="tile-game-bold">Checking for a final score…</div></div>`;
    } else {
      html += `<div class="dash-tile"><div class="tile-game-bold">No games played yet</div></div>`;
    }
    html += `</div></div>`;
  });
  html += `</div>`;

  html += `<h2 class="section-title" style="font-size:20px; margin-top:24px;">Next 3 Games</h2><div class="dash-columns">`;
  DASHBOARD_COLUMNS.forEach(sportKey => {
    const sport = TEAMS[sportKey];
    let cards = [];
    sport.order.forEach(teamKey => {
      const team = sport.teams[teamKey];
      nextGames(teamKey, 3).forEach(game => cards.push({ teamKey, team, game }));
    });
    cards.sort((a, b) => gameSortValue(a.game) - gameSortValue(b.game));

    html += `<div class="dash-col"><h3 class="dash-col-link" onclick="goToSport('${sportKey}')">${sport.label}</h3><div class="dash-col-tiles">`;
    if (cards.length){
      cards.forEach(({ teamKey, team, game }) => {
        html += dashboardCardHTML(sportKey, teamKey, team, game);
      });
    } else {
      html += `<div class="dash-tile"><div class="tile-game-bold">No games loaded</div></div>`;
    }
    html += `</div></div>`;
  });
  html += `</div>`;
  return html;
}

function goToTeam(sportKey, teamKey){
  state.primary = sportKey;
  state.secondary = teamKey;
  renderAll();
}

/* =========================================================
   CALENDAR TAB
========================================================= */

function calendarColorFor(sportKey, teamKey){
  if (sportKey === "cfb") return teamKey === "usc" ? "var(--usc-1)" : "var(--uw-1)";
  const team = TEAMS[sportKey].teams[teamKey];
  return team.dashColor || team.c1;
}

// Splits a stored tv string like "ESPN+ 7:00pm PT" or "TV TBA 1:05pm PT · note"
// into separate network / time parts for the calendar's 3-segment format.
function parseGameTV(tvStr){
  if (!tvStr) return { network:"TBA", time:"" };
  const main = tvStr.split(" · ")[0].trim();
  const timeMatch = main.match(/\d{1,2}:\d{2}\s?(am|pm)\s?PT/i);
  if (timeMatch){
    const time = timeMatch[0];
    const network = main.replace(time, "").trim() || "TBA";
    return { network, time };
  }
  return { network: main || "TBA", time:"" };
}

function collectGamesForDate(dateStr){
  const bySport = {};
  Object.keys(TEAMS).forEach(sportKey => {
    TEAMS[sportKey].order.forEach(teamKey => {
      const g = (SCHEDULES[teamKey] || []).find(x => x.date === dateStr);
      if (g && g.status !== "bye"){
        (bySport[sportKey] ||= []).push({ sportKey, teamKey, game:g });
      }
    });
  });
  let result = [];
  Object.keys(bySport).forEach(sportKey => {
    const entries = bySport[sportKey];
    const primaryKey = TEAMS[sportKey].order[0];
    const hasPrimary = entries.some(e => e.teamKey === primaryKey);
    entries.forEach(e => {
      if (hasPrimary && e.teamKey !== primaryKey){
        const primaryDisplay = DISPLAY_NAME[primaryKey];
        // Same real-world game as the primary team's entry — skip the secondary's line.
        if (e.game.opp.includes(primaryDisplay)) return;
      }
      result.push(e);
    });
  });
  // Chronological by actual kickoff time — being the primary team doesn't jump the queue.
  result.sort((a, b) => parseTimeMinutes(a.game.tv) - parseTimeMinutes(b.game.tv));
  return result;
}

function calendarEntryHTML(entry){
  const { sportKey, teamKey, game } = entry;
  const color = calendarColorFor(sportKey, teamKey);
  const teamDisp = DISPLAY_NAME[teamKey];
  const oppDisp = MASCOT_MAP[game.opp] || game.opp;
  const matchupLine = `<span class="cal-entry-team">${teamDisp}</span> ${game.home ? "vs" : "@"} ${oppDisp}`;

  if (game.status === "final"){
    const win = game.score.team > game.score.opp;
    const resultColor = win ? "#2f7a2f" : "#a33";
    const record = cumulativeRecordThrough(SCHEDULES[teamKey] || [], game);
    return `<div class="cal-entry" style="--tc:${color}">
      <div class="cal-entry-matchup">${matchupLine}</div>
      <div class="cal-entry-meta" style="font-weight:bold; color:${resultColor};">${game.score.team}-${game.score.opp} (${win ? "W" : "L"})${record ? ` · ${record}` : ""}</div>
    </div>`;
  }
  if (game.date < todayISO()){
    // Past but not yet confirmed final (live fetch missed it or hasn't run) — no point
    // showing a stale kickoff time/network for a game that's already happened.
    return `<div class="cal-entry" style="--tc:${color}">
      <div class="cal-entry-matchup">${matchupLine}</div>
    </div>`;
  }
  const { network, time } = parseGameTV(game.tv);
  const metaLine = time ? `${time} - ${network}` : network;
  return `<div class="cal-entry" style="--tc:${color}">
    <div class="cal-entry-matchup">${matchupLine}</div>
    <div class="cal-entry-meta">${metaLine}</div>
  </div>`;
}

function daysInMonth(year, monthIdx){ return new Date(year, monthIdx + 1, 0).getDate(); }
function firstWeekdayOfMonth(year, monthIdx){ return new Date(year, monthIdx, 1).getDay(); }

// Full season, Sept 2026 – April 2027 — all shown stacked on one scrollable page.
const SEASON_MONTHS = [
  [2026,8],[2026,9],[2026,10],[2026,11],
  [2027,0],[2027,1],[2027,2],[2027,3]
];

// Clamp "today" into the season range: before Sept 2026 -> first month, after April
// 2027 -> last month, otherwise whichever month actually contains today.
function currentSeasonMonthIndex(){
  const [y, m] = todayISO().split("-").map(Number);
  const key = y * 100 + (m - 1);
  let idx = SEASON_MONTHS.findIndex(([sy, sm]) => sy === y && sm === (m - 1));
  if (idx !== -1) return idx;
  const [firstY, firstM] = SEASON_MONTHS[0];
  const [lastY, lastM] = SEASON_MONTHS[SEASON_MONTHS.length - 1];
  if (key < firstY * 100 + firstM) return 0;
  if (key > lastY * 100 + lastM) return SEASON_MONTHS.length - 1;
  return 0;
}

function calNav(delta){
  let idx = SEASON_MONTHS.findIndex(([y, m]) => y === state.calYear && m === state.calMonth);
  if (idx === -1) idx = 0;
  idx = Math.max(0, Math.min(SEASON_MONTHS.length - 1, idx + delta));
  const [y, m] = SEASON_MONTHS[idx];
  state.calYear = y;
  state.calMonth = m;
  const el = document.getElementById(`cal-month-${y}-${m}`);
  if (el) el.scrollIntoView({ behavior:"smooth", block:"start" });
  const label = document.getElementById("calCurrentLabel");
  if (label) label.textContent = new Date(y, m, 1).toLocaleDateString("en-US", { month:"long", year:"numeric" });
}

// Scroll-spy: keep the sticky label in sync with whichever month is actually in
// view, instead of only updating on Prev/Next clicks.
let calendarScrollObserver = null;
function initCalendarScrollSync(){
  if (calendarScrollObserver) calendarScrollObserver.disconnect();
  const sections = document.querySelectorAll(".cal-month-section");
  const label = document.getElementById("calCurrentLabel");
  if (!sections.length || !label) return;
  calendarScrollObserver = new IntersectionObserver((entries) => {
    let best = null;
    entries.forEach(e => {
      if (e.isIntersecting && (!best || e.intersectionRatio > best.intersectionRatio)) best = e;
    });
    if (best){
      const m = best.target.id.match(/cal-month-(\d+)-(\d+)/);
      if (m){
        const y = parseInt(m[1], 10), mo = parseInt(m[2], 10);
        state.calYear = y;
        state.calMonth = mo;
        label.textContent = new Date(y, mo, 1).toLocaleDateString("en-US", { month:"long", year:"numeric" });
      }
    }
  }, { rootMargin:"-120px 0px -60% 0px", threshold:[0, 0.25, 0.5, 0.75, 1] });
  sections.forEach(s => calendarScrollObserver.observe(s));
}

function renderMonthSection(year, month){
  const monthLabel = new Date(year, month, 1).toLocaleDateString("en-US", { month:"long", year:"numeric" });
  const totalDays = daysInMonth(year, month);
  const startWeekday = firstWeekdayOfMonth(year, month);
  const todayStr = todayISO();

  let cells = "";
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= totalDays; d++){
    const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const entries = collectGamesForDate(dateStr);
    const isToday = dateStr === todayStr;
    cells += `<div class="cal-cell${isToday ? " is-today" : ""}">
      <div class="cal-daynum">${d}</div>
      ${entries.map(calendarEntryHTML).join("")}
    </div>`;
  }
  const trailing = (7 - ((startWeekday + totalDays) % 7)) % 7;
  for (let i = 0; i < trailing; i++) cells += `<div class="cal-cell empty"></div>`;

  return `
    <div class="cal-month-section" id="cal-month-${year}-${month}">
      <div class="cal-month-heading">${monthLabel}</div>
      <div class="cal-grid">
        <div class="cal-dow">Sun</div><div class="cal-dow">Mon</div><div class="cal-dow">Tue</div>
        <div class="cal-dow">Wed</div><div class="cal-dow">Thu</div><div class="cal-dow">Fri</div><div class="cal-dow">Sat</div>
        ${cells}
      </div>
    </div>`;
}

function renderCalendar(){
  const initialLabel = new Date(state.calYear, state.calMonth, 1).toLocaleDateString("en-US", { month:"long", year:"numeric" });
  const sections = SEASON_MONTHS.map(([y, m]) => renderMonthSection(y, m)).join("");
  return `
    <h2 class="section-title">Calendar</h2>
    <div class="cal-header">
      <button class="refresh-btn cal-nav-btn" onclick="calNav(-1)">↑ Prev Month</button>
      <div class="cal-month-label" id="calCurrentLabel">${initialLabel}</div>
      <button class="refresh-btn cal-nav-btn" onclick="calNav(1)">Next Month ↓</button>
    </div>
    ${sections}`;
}

function renderContent(){
  const content = document.getElementById("content");
  content.classList.toggle("dashboard-view", state.primary === "dashboard");
  if (state.primary === "dashboard"){
    content.innerHTML = renderDashboard();
    return;
  }
  if (state.primary === "calendar"){
    content.innerHTML = renderCalendar();
    initCalendarScrollSync();
    if (state.calendarJumpPending){
      state.calendarJumpPending = false;
      const el = document.getElementById(`cal-month-${state.calYear}-${state.calMonth}`);
      if (el) el.scrollIntoView({ behavior:"auto", block:"start" });
    }
    return;
  }
  if (state.primary === "cfb" && state.secondary === "main"){
    content.innerHTML = renderCFBMain();
    return;
  }
  if (state.primary === "nfl" && state.secondary === "main"){
    content.innerHTML = renderNFLCompare();
    return;
  }
  if (state.primary === "nfl" && state.secondary === "compare"){
    content.innerHTML = renderNFLCompare();
    return;
  }
  if (state.secondary === "standings"){
    if (state.primary === "cfb") content.innerHTML = renderCFBStandings();
    if (state.primary === "nfl") content.innerHTML = renderNFLStandings();
    if (state.primary === "nhl") content.innerHTML = renderNHLStandings();
    return;
  }
  content.innerHTML = renderTeamSchedule(state.primary, state.secondary);
}

function renderAll(){
  renderPrimaryNav();
  renderSecondaryNav();
  renderContent();
}

renderAll();
fetchAllLiveScores();
</script>
